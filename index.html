function startReview(){const pending=state.mistakes.filter(x=>!x.resolved&&(WORDS.some(w=>w.id===x.wordId)||SENTENCE_QUESTIONS.some(w=>w.id===x.wordId)));if(!pending.length){alert('다시 풀 오답이 없습니다.');return}reviewQueue=pending.map(x=>x.id);reviewCursor=0;reviewActive=true;tab='quiz';nextReview()}
function record(ok){let s=state.stats[q.w.id]||{right:0,wrong:0,streak:0};if(ok){s.right++;s.streak++}else{s.wrong++;s.streak=0}s.last=Date.now();state.stats[q.w.id]=s;state.history.push({time:Date.now(),id:q.w.id,ok,kind:q.actual});if(state.history.length>3000)state.history=state.history.slice(-3000);session.n++;if(ok)session.correct++;save()}
function verify(){if(revealed||!q)return;let ok=normalize(selected)===normalize(q.correct);if(q.actual==='reverse'&&normalize(selected)===normalize(q.w.jp))ok=true;revealed=true;
 if(q.mistakeId){const m=state.mistakes.find(x=>x.id===q.mistakeId);if(m){m.attempts=(m.attempts||0)+1;if(ok){m.resolved=true;m.resolvedAt=Date.now()}else{m.answer=selected;m.time=Date.now()}}}
 else if(!ok)storeMistake(q,selected);
 record(ok);render()}
function explanation(q){
 const w=q.w;
 if(q.actual==='sentence')return `<strong>문장 해설</strong><p>${esc(q.sentenceExplanation||'문맥과 문법을 함께 확인하세요.')}</p><p><strong>완성 문장:</strong> ${esc(w.jp.replace('（　）',q.correct))}</p><p class="sub">${esc(w.ko)}</p>`;
 if(q.actual==='incorrect'){
  const kinds=['nai','te','ta','masu','potential','tara'];
  const names={nai:'부정',te:'연결',ta:'과거',masu:'정중',potential:'가능',tara:'조건'};
  const lines=kinds.filter(k=>q.opts.some(o=>o.startsWith(conjugate(w,k)+' · '))).map(k=>{
   const form=conjugate(w,k),expected=conjugationMeaning(w.ko,k);
   const wrong=k===q.wrongKind;
   return `<div class="explain-line ${wrong?'explain-highlight':''}"><strong>${esc(form)}</strong> — ${esc(expected)}${wrong?' <strong>← 이 활용형의 올바른 의미</strong>':''}</div>`;
  });
  return `<strong>왜 틀렸나요?</strong><p>${esc(q.correct)}는 일본어 활용형과 의미가 서로 맞지 않습니다. 해당 활용형의 실제 문법적 의미를 아래에서 비교하세요.</p>${lines.join('')}<p class="sub">원형 ${esc(w.jp)} (${esc(w.kana)}) · ${esc(w.ko)} / ${esc(w.group)}그룹 동사</p>`;
 }
 if(q.actual==='conj'){
  const names={nai:'부정',te:'연결',ta:'과거',masu:'정중',potential:'가능',tara:'조건'};
  return `<strong>활용 해설</strong><p>${esc(w.kana)} → <strong>${esc(q.correct)}</strong> (${names[q.kind]}: ${conjugationMeaning(w.ko,q.kind)})</p><p class="sub">${esc(w.group)}그룹 동사입니다. 기본형의 끝부분이 해당 활용 규칙에 맞춰 변합니다.</p>`;
 }
 if(q.actual==='counter')return `<strong>발음 해설</strong><p>${esc(w.ko)}의 올바른 읽기는 <strong>${esc(w.kana)}</strong>입니다. 조수사는 숫자와 단위의 조합에 따라 발음이 달라질 수 있으므로 소리 내어 복습해 보세요.</p>`;
 if(q.actual==='reverse')return `<strong>단어 해설</strong><p>${esc(w.ko)} → <strong>${esc(w.jp)} (${esc(w.kana)})</strong>입니다. 한자 표기와 히라가나 읽기를 함께 기억하세요.</p>`;
 return `<strong>단어 해설</strong><p><strong>${esc(w.jp)} (${esc(w.kana)})</strong>의 뜻은 <strong>${esc(w.ko)}</strong>입니다. 다른 보기와 구분해 기억해 보세요.</p>`;
}
function section(content){document.getElementById('app').innerHTML=content}
function home(){const attempted=Object.keys(state.stats).length,total=state.history.length,good=state.history.filter(h=>h.ok).length,wrong=Object.values(state.stats).filter(s=>s.wrong>0&&s.streak<2).length;section(`<div class="hero"><div class="eyebrow">YOUR JAPANESE, EVERY DAY</div><h1>오늘의 일본어 학습</h1><p>어휘와 활용형을 복습하고, 헷갈리는 발음을 다시 확인하세요.</p><div class="actions"><button class="btn primary" data-go="quiz">학습 시작 →</button><button class="btn" data-go="sjpt">SJPT 문제 풀기</button></div></div><div class="grid"><div class="card"><div class="statlabel">수록 학습 항목</div><div class="stat">${WORDS.length}</div><div class="sub">단어·표현·조수사 매핑</div></div><div class="card"><div class="statlabel">학습해 본 항목</div><div class="stat">${attempted}</div><div class="sub">${Math.round(attempted/WORDS.length*100)}% 학습 시작</div></div><div class="card"><div class="statlabel">누적 정답률</div><div class="stat">${total?Math.round(good/total*100):0}%</div><div class="sub">${total}문제 중 ${good}문제 정답</div></div></div><div class="section-title">오늘의 학습 로드맵</div><div class="split"><div class="card"><div class="row"><strong>적응형 문제 추천</strong><span class="pill orange">취약 ${wrong}개</span></div><p class="sub">이미 아는 25개 어휘는 낮은 빈도로 등장합니다. 오답을 내면 출제 비중이 올라갑니다.</p><div class="progress"><div style="width:${Math.min(100,session.n/state.settings.sessionSize*100)}%"></div></div><p class="sub">현재 세션 ${session.n} / ${state.settings.sessionSize}문제</p><div class="actions"><button class="btn primary" data-go="quiz">오늘의 문제 풀기</button><button class="btn" data-go="review">오답노트</button><button class="btn ghost" data-session-reset="1">단어 퀴즈 기록 초기화</button><button class="btn ghost" data-sj-reset="1">SJPT 세션 초기화</button></div></div><div class="card"><strong>추천 학습 순서</strong><p class="sub">① 혼합 퀴즈 20문제<br>② 조수사 발음 5문제<br>③ SJPT 청해·객관식 5문제</p><button class="btn" data-go="counter">조수사 연습하기</button></div></div>`)}

function quizChoiceGloss(o){
 const raw=String(o);
 if(q.actual==='meaning'){
  const match=WORDS.find(w=>w.ko===raw);
  return match?`${match.jp} (${match.kana})`:'';
 }
 if(q.actual==='counter'){
  const match=WORDS.find(w=>w.cat==='counter'&&w.kana===raw);
  return match?match.ko:'';
 }
 if(q.actual==='incorrect')return '';
 return QUIZ_CHOICE_GLOSSES[raw]||'';
}
function quizChoiceAudio(o){
 if(q.actual==='meaning'){
  const match=WORDS.find(w=>w.ko===o);
  return match?match.kana:'';
 }
 if(q.actual==='incorrect')return String(o).split(' · ')[0];
 return o;
}
function quizChoiceDisplay(o){
 const raw=String(o);
 const gloss=quizChoiceGloss(o);
 // Only Japanese text receives furigana; never pass already-escaped HTML to ruby conversion.
 const jpText=quizFuriganaVisible && /[\u3040-\u30ff\u3400-\u9fff]/.test(raw) && !/^[\uac00-\ud7a3\s]+$/.test(raw)
   ? sjptFurigana(raw) : esc(raw);
 return `<span class="quiz-option-text">${jpText}</span>${revealed&&gloss?` <span class="choice-gloss">— ${esc(gloss)}</span>`:''}`;
}

function quiz(){if(!q)next();const w=q.w,labels={nai:'ない형',te:'て형',ta:'た형',masu:'ます형',potential:'가능형',tara:'たら 조건형'},isChoice=q.opts.length>0;let prompt=q.actual==='meaning'?'일본어 단어의 한국어 뜻을 선택하세요.':q.actual==='counter'?'다음 수량을 일본어로 어떻게 읽을까요?':q.actual==='conj'?`다음 동사를 ${labels[q.kind]}으로 바꿔 입력하세요.`:q.actual==='reverse'?'한국어 뜻에 맞는 일본어 읽기를 입력하세요.':q.actual==='sentence'?'한국어 뜻을 보고 빈칸에 들어갈 알맞은 표현을 고르세요.':'다음 중 동사 활용형과 뜻의 연결이 올바르지 않은 것은?';let target=q.actual==='sentence'?`<div class="sentence-jp">${quizFuriganaVisible?sjptFurigana(w.jp):esc(w.jp)}</div>${quizFuriganaVisible?`<div class="sentence-reading">${esc(w.kana)}</div>`:""}<div class="word-meaning">${esc(w.ko)}</div>`:q.actual==='counter'?esc(w.ko):q.actual==='reverse'?esc(w.ko):(quizFuriganaVisible?ruby(w):esc(w.jp));let response=isChoice?`<div class="answers">${q.opts.map((o,i)=>`<div class="quiz-choice-row"><button class="choice ${selected===o?'selected':''} ${revealed&&o===q.correct?'correct':''} ${revealed&&selected===o&&o!==q.correct?'wrong':''}" data-choice="${esc(o)}" ${revealed?'disabled':''}>${i+1}. ${quizChoiceDisplay(o)}</button>${quizChoiceAudio(o)?`<button class="choice-audio" data-tts="${esc(quizChoiceAudio(o))}" title="이 보기 발음 듣기" aria-label="${i+1}번 보기 발음 듣기">🔊</button>`:""}</div>`).join('')}</div>`:`<input id="answer" class="textinput" placeholder="${'히라가나로 입력하세요'}" value="${esc(selected)}" ${revealed?'disabled':''} autocomplete="off" spellcheck="false">`;let result=revealed?`<div class="notice ${normalize(selected)!==normalize(q.correct)&&!(q.actual==='reverse'&&normalize(selected)===normalize(w.jp))?'bad':''}">${`<strong>${normalize(selected)===normalize(q.correct)||(q.actual==='reverse'&&normalize(selected)===normalize(w.jp))?'정답입니다!':'다시 복습해 보세요.'}</strong><br>정답: ${esc(q.correct)}`}<div class="sub">${esc(w.jp)} (${esc(w.kana)}) · ${esc(w.ko)}</div><div class="explanation">${explanation(q)}</div></div>`:'';section(`<div class="row"><div><div class="eyebrow">ADAPTIVE QUIZ</div><h2 style="margin:3px 0">${reviewActive?'오답 다시 풀기':'오늘의 학습'}</h2></div><span class="pill">세션 ${session.n}문제 · 정답 ${session.correct}</span></div><div class="actions" style="margin:12px 0 20px"><select id="mode" class="select" style="max-width:260px"><option value="mixed" ${mode==='mixed'?'selected':''}>혼합 출제</option><option value="meaning" ${mode==='meaning'?'selected':''}>단어 뜻</option><option value="reverse" ${mode==='reverse'?'selected':''}>한국어 → 일본어</option><option value="conj" ${mode==='conj'?'selected':''}>동사 활용형</option><option value="counter" ${mode==='counter'?'selected':''}>조수사 발음</option><option value="incorrect" ${mode==='incorrect'?'selected':''}>틀린 활용형 찾기</option><option value="sentence" ${mode==='sentence'?'selected':''}>문장 빈칸 채우기</option></select><button class="btn small ghost" data-new="1">${reviewActive?'다음 오답':'문제 바꾸기'}</button><button class="btn small quiz-furi-toggle ${quizFuriganaVisible?'active':''}" data-quiz-furigana="1" aria-pressed="${quizFuriganaVisible}"><span class="quiz-furi-icon">あ</span> 후리가나 ${quizFuriganaVisible?'ON':'OFF'}</button>${reviewActive?`<button class="btn small" data-stop-review="1">오답노트로</button>`:''}</div><div class="card" style="max-width:790px"><div class="row"><span class="pill">${{meaning:'어휘',reverse:'어휘 직접 입력',conj:'동사 활용',counter:'조수사',incorrect:'틀린 활용형 찾기',sentence:'문장 빈칸'}[q.actual]}</span><span class="sub">${q.actual==='counter'?esc(w.counter):(CATS[w.cat]||'문장 연습')}</span></div><p class="prompt">${prompt}</p><div class="bigjp">${target}</div>${q.actual==='conj'?`<div class="word-meaning">뜻: ${esc(w.ko)} · ${w.group}그룹 동사</div>`:q.actual==='incorrect'?`<div class="word-meaning">뜻: ${esc(w.ko)}</div>`:''}${q.actual!=='counter'&&q.actual!=='reverse'&&q.actual!=='sentence'?`<button class="btn small ghost" data-tts="${esc(w.kana)}">▶ 발음 듣기</button>`:''}${response}${result}<div class="actions">${!revealed?`<button class="btn primary" id="check" ${!selected?'disabled':''}>${'정답 확인'}</button>`:`<button class="btn primary" data-next="1 function hashWord(id,seed){let h=seed|0;for(const c of String(id))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function vocab(){let data=WORDS.filter(w=>(vocabLevel==='all'||(vocabLevel==='basic'?!w.id.startsWith('beginner_'):w.id.startsWith('beginner_')))&&(filterCat==='all'||w.cat===filterCat)&&(`${w.jp} ${w.kana} ${w.ko}`).toLowerCase().includes(filterText.toLowerCase()));if(vocabSort==='kana')data.sort((a,b)=>a.kana.localeCompare(b.kana,'ja'));else if(vocabSort==='shuffle')data.sort((a,b)=>hashWord(a.id,vocabShuffle)-hashWord(b.id,vocabShuffle));section(`<div class="row"><div><div class="eyebrow">WORD LIBRARY</div><h2 style="margin:3px 0">나만의 단어장</h2></div><span class="pill">${data.length}개 표시</span></div><p class="sub">'익숙함'을 표시해도 학습에서 제외되지 않으며 출제 빈도만 낮아집니다.</p><div class="level-switch" role="group" aria-label="단어 수준 선택"><button class="btn ${vocabLevel==='all'?'primary':''}" data-level="all">전체</button><button class="btn ${vocabLevel==='basic'?'primary':''}" data-level="basic">기본</button><button class="btn ${vocabLevel==='beginner'?'primary':''}" data-level="beginner">초급</button></div><div class="actions"><select id="catfilter" class="select" style="max-width:190px"><option value="all">전체 품사</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${filterCat===k?'selected':''}>${v}</option>`).join('')}</select><input id="search" class="textinput" style="max-width:300px" placeholder="단어·읽기·뜻 검색" value="${esc(filterText)}"></div><div class="vocab-tools"><select id="vocabsort" class="select"><option value="kana" ${vocabSort==='kana'?'selected':''}>히라가나 순</option><option value="shuffle" ${vocabSort==='shuffle'?'selected':''}>랜덤 셔플</option></select><button class="btn" data-shuffle="1">다시 섞기</button><button class="btn" data-hide="1">${hideMeanings?'뜻 전체 보기':'뜻 가리기'}</button></div><div class="tablewrap" style="margin-top:15px"><table class="vocab"><thead><tr><th>일본어 / 읽기</th><th>뜻</th><th>숙련도</th><th>표시</th></tr></thead><tbody>${data.map(w=>{const s=state.stats[w.id]||{},k=state.known[w.id]??w.known;return `<tr><td><strong>${esc(w.jp)}</strong><small>${esc(w.kana)}</small></td><td>${hideMeanings&&!shownMeanings.has(w.id)?`<button class="meaning-reveal" data-reveal="${w.id}">뜻 확인</button>`:`<span class="meaning-visible">${esc(w.ko)} <button class="meaning-reveal" data-conceal="${w.id}">다시 가리기</button></span>`}</td><td class="vocab-status"><span class="pill ${s.streak>=3?'green':s.wrong&&s.streak<2?'orange':''}">${s.streak>=3?'숙달':s.wrong&&s.streak<2?'복습 필요':k?'익숙함':'학습 중'}</span></td><td><button class="btn small" data-known="${w.id}">${k?'익숙함 ✓':'익숙함 표시'}</button></td></tr>`}).join('')}</tbody></table></div>`)}
function review(){
 const all=state.mistakes||[],pending=all.filter(m=>!m.resolved),data=all.filter(m=>reviewFilter==='all'||(reviewFilter==='open'?!m.resolved:m.resolved));
 const grouped=new Map();for(const m of data){const w=WORDS.find(x=>x.id===m.wordId)||(m.actual==='sentence'?SENTENCE_QUESTIONS.find(x=>x.id===m.wordId):null);if(!w)continue;let item=grouped.get(w.id);if(!item){item={w,items:[]};grouped.set(w.id,item)}item.items.push(m)}
 const kinds={meaning:'뜻 선택',reverse:'일본어 읽기',conj:'동사 활용',counter:'조수사 발음',incorrect:'잘못된 활용 찾기',sentence:'문장 빈칸'};
 const rows=[...grouped.values()].map(({w,items})=>{const examples=w.id.startsWith('sentence_')?`<div class="review-example"><span>${esc(w.jp.replace('（　）',items[0].correct))}</span><span>${esc(w.ko)}</span></div><p class="sub">${esc(items[0].sentenceExplanation||'문장 뜻과 활용을 확인하세요.')}</p>`:w.cat==='verb'&&w.group?['nai','te','ta','potential','tara'].map(k=>`<div class="review-example"><span>${esc(conjugate(w,k))}</span><span>${esc(conjugationMeaning(w.ko,k))}</span></div>`).join(''):`<div class="review-example"><span>${esc(w.jp)}（${esc(w.kana)}）</span><span>${esc(w.ko)}</span></div>`;
 return `<article class="card review-card"><div class="row"><div><div class="review-word">${ruby(w)}</div><div class="reading">${esc(w.kana)}</div><div class="word-meaning">${esc(w.ko)}</div></div><span class="pill orange">${items.length}건</span></div><button class="btn small ghost" data-tts="${esc(w.kana)}">▶ 발음 듣기</button><details class="review-details"><summary>예시 활용 및 해설 보기</summary><div class="review-examples">${examples}</div><p class="sub">문제 유형: ${[...new Set(items.map(x=>kinds[x.actual]||x.actual))].join(' · ')}</p><p class="sub">최근 오답: ${esc(items[0].answer||'미입력')} / 정답: ${esc(items[0].correct)}</p></details></article>`}).join('');
 section(`<div class="row"><div><div class="eyebrow">REVIEW</div><h2 style="margin:3px 0">오답노트</h2></div><span class="pill">미해결 ${pending.length}건</span></div><p class="sub">틀린 문제를 저장하고, 같은 문제를 다시 풀어 정답이면 복습 완료로 표시합니다. 단어별로 활용 예시도 확인할 수 있습니다.</p><div class="review-actions"><button class="btn primary" data-start-review="1" ${pending.length?'':'disabled'}>틀린 문제 다시 풀기 (${pending.length})</button><button class="btn ${reviewFilter==='open'?'primary':''}" data-review-filter="open">미해결</button><button class="btn ${reviewFilter==='done'?'primary':''}" data-review-filter="done">완료</button><button class="btn ${reviewFilter==='all'?'primary':''}" data-review-filter="all">전체</button></div><div class="review-list">${rows||'<div class="card sub">해당하는 오답이 없습니다. 문제를 풀다가 틀리면 여기에 저장됩니다.</div>'}</div>`);

きです。短い時間で物語を楽しめますし、映像や音楽も一緒に楽しめるからです。","はい、そう思います。健康にいいからです。","はい、いいと思います。小さいころから慣れることができるからです。","はい、立てたほうがいいです。時間を有効に使えるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"책과 영화 중 어느 쪽을 좋아하는지 묻습니다.","answerMeaning":"저는 영화를 더 좋아합니다. 짧은 시간에 이야기를 즐길 수 있고, 영상과 음악도 함께 즐길 수 있기 때문입니다."},{"id":"sj5_5","part":5,"jp":"運動は毎日したほうがいいと思いますか。","correct":"私は毎日運動することに賛成です。健康を維持できますし、ストレスも減らせるからです。","opts":["私は毎日運動することに賛成です。健康を維持できますし、ストレスも減らせるからです。","インターネットのほうが便利だと思います。時間を節約できます。","いいと思います。車より環境にやさしいからです。","友達と旅行するほうがいいと思います。一緒に楽しめるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"매일 운동하는 것이 좋은지 의견을 묻습니다.","answerMeaning":"저는 매일 운동하는 것에 찬성합니다. 건강을 유지할 수 있고 스트레스도 줄일 수 있기 때문입니다."},{"id":"sj5_6","part":5,"jp":"買い物は店とインターネットではどちらが便利ですか。","correct":"私はインターネットで買い物するほうが便利だと思います。家でいつでも注文できますし、時間を節約できるからです。","opts":["私はインターネットで買い物するほうが便利だと思います。家でいつでも注文できますし、時間を節約できるからです。","はい、いいと思います。小さいころから慣れることができるからです。","家で休むほうが好きです。ゆっくりできるからです。","都会に住みたいです。交通が便利だからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"매장과 인터넷 쇼핑 중 어느 쪽이 편리한지 묻습니다.","answerMeaning":"인터넷 쇼핑이 더 편리하다고 생각합니다. 집에서 언제든 주문할 수 있고 시간을 절약할 수 있기 때문입니다."},{"id":"sj5_7","part":5,"jp":"子供は外国語を早く勉強したほうがいいですか。","correct":"私は賛成です。子供のころから外国語に慣れることができますし、ほかの国の文化も学べるからです。","opts":["私は賛成です。子供のころから外国語に慣れることができますし、ほかの国の文化も学べるからです。","いいと思います。車より環境にやさしいからです。","はい、立てたほうがいいです。時間を有効に使えるからです。","いいと思います。通勤時間を減らせるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"아이들이 일찍 외국어를 배우는 것이 좋은지 묻습니다.","answerMeaning":"저는 찬성합니다. 어릴 때부터 외국어에 익숙해질 수 있고 다른 나라의 문화도 배울 수 있기 때문입니다."},{"id":"sj5_8","part":5,"jp":"公共交通機関を利用することについてどう思いますか。","correct":"私は公共交通機関を利用するのはいいと思います。車より環境にやさしいですし、渋滞を減らすことにも役立つからです。","opts":["私は公共交通機関を利用するのはいいと思います。車より環境にやさしいですし、渋滞を減らすことにも役立つからです。","家で休むほうが好きです。ゆっくりできるからです。","友達と旅行するほうがいいと思います。一緒に楽しめるからです。","映画のほうが好きです。短い時間で楽しめるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"대중교통 이용에 대한 의견을 묻습니다.","answerMeaning":"대중교통 이용은 좋다고 생각합니다. 자동차보다 환경에 좋고 교통 체증을 줄이는 데 도움이 되기 때문입니다."},{"id":"sj5_9","part":5,"jp":"休日は家で休むのと外出するのではどちらがいいですか。","correct":"私は休日は家で休むほうが好きです。平日は忙しいので、ゆっくり休んで次の週の準備をしたいからです。","opts":["私は休日は家で休むほうが好きです。平日は忙しいので、ゆっくり休んで次の週の準備をしたいからです。","はい、立てたほうがいいです。時間を有効に使えるからです。","都会に住みたいです。交通が便利だからです。","はい、そう思います。健康にいいからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"휴일에 집에서 쉬는 것과 외출하는 것 중 무엇이 좋은지 묻습니다.","answerMeaning":"저는 집에서 쉬는 편이 좋습니다. 평일에 바쁘기 때문에 휴일에는 충분히 쉬면서 다음 주를 준비하고 싶기 때문입니다."},{"id":"sj5_10","part":5,"jp":"旅行の前に計画を立てるべきだと思いますか。","correct":"私は旅行の前に計画を立てたほうがいいと思います。時間を有効に使えますし、大切な場所を見逃さずに済むからです。","opts":["私は旅行の前に計画を立てたほうがいいと思います。時間を有効に使えますし、大切な場所を見逃さずに済むからです。","友達と旅行するほうがいいと思います。一緒に楽しめるからです。","いいと思います。通勤時間を減らせるからです。","インターネットのほうが便利だと思います。時間を節約できます。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"여행 전에 계획을 세워야 하는지 묻습니다.","answerMeaning":"저는 계획을 세우는 편이 좋다고 생각합니다. 시간을 효율적으로 쓸 수 있고 중요한 장소를 놓치지 않을 수 있기 때문입니다."},{"id":"sj6_1","part":6,"jp":"レストランで注文と違う料理が来ました。何と言いますか。","correct":"すみません。注文した料理と違うようです。注文の内容を確認していただけますか。","opts":["すみません。注文した料理と違うようです。注文の内容を確認していただけますか。","ごめんなさい。電車が遅れているので、十分ぐらい遅れます。","すみません、買った商品が壊れていました。交換できますか。","誘ってくれてありがとう。でも、予定があるので行けません。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"주문한 음식과 다른 음식이 나왔을 때 직원에게 정중하게 확인을 요청하는 상황입니다.","answerMeaning":"실례합니다. 제가 주문한 음식과 다른 것 같습니다. 주문 내용을 확인해 주실 수 있을까요?"},{"id":"sj6_2"  좋다고 생각합니다. 어릴 때부터 익숙해질 수 있기 때문입니다.","私は都会に住みたいです。交通が便利ですし、買い物や病院に行くのも簡単だからです。":"저는 도시에 살고 싶습니다. 교통이 편리하고 쇼핑하거나 병원에 가기도 쉽기 때문입니다.","いいと思います。通勤時間を減らせるからです。":"좋다고 생각합니다. 통근 시간을 줄일 수 있기 때문입니다.","はい、そう思います。健康にいいからです。":"네, 그렇게 생각합니다. 건강에 좋기 때문입니다.","いいと思います。車より環境にやさしいからです。":"좋다고 생각합니다. 자동차보다 친환경적이기 때문입니다.","私は家で働くことに賛成です。通勤時間を減らせますし、その時間を家族や趣味のために使えるからです。":"저는 재택근무에 찬성합니다. 출퇴근 시간을 줄이고 그 시간을 가족이나 취미에 쓸 수 있기 때문입니다.","インターネットのほうが便利だと思います。時間を節約できます。":"인터넷이 더 편리하다고 생각합니다. 시간을 절약할 수 있습니다.","家で休むほうが好きです。ゆっくりできるからです。":"집에서 쉬는 편을 좋아합니다. 편하게 쉴 수 있기 때문입니다.","私は映画のほうが好きです。短い時間で物語を楽しめますし、映像や音楽も一緒に楽しめるからです。":"저는 영화를 더 좋아합니다. 짧은 시간에 이야기를 즐기고 영상과 음악도 함께 즐길 수 있기 때문입니다.","はい、立てたほうがいいです。時間を有効に使えるからです。":"네, 계획을 세우는 편이 좋습니다. 시간을 효율적으로 쓸 수 있기 때문입니다.","私は毎日運動することに賛成です。健康を維持できますし、ストレスも減らせるからです。":"저는 매일 운동하는 것에 찬성합니다. 건강을 유지하고 스트레스도 줄일 수 있기 때문입니다.","友達と旅行するほうがいいと思います。一緒に楽しめるからです。":"친구와 여행하는 편이 좋다고 생각합니다. 함께 즐길 수 있기 때문입니다.","私はインターネットで買い物するほうが便利だと思います。家でいつでも注文できますし、時間を節約できるからです。":"저는 인터넷 쇼핑이 더 편리하다고 생각합니다. 집에서 언제든 주문하고 시간을 절약할 수 있기 때문입니다.","私は賛成です。子供のころから外国語に慣れることができますし、ほかの国の文化も学べるからです。":"저는 찬성합니다. 어릴 때부터 외국어에 익숙해지고 다른 나라 문화도 배울 수 있기 때문입니다.","私は公共交通機関を利用するのはいいと思います。車より環境にやさしいですし、渋滞を減らすことにも役立つからです。":"저는 대중교통 이용이 좋다고 생각합니다. 자동차보다 친환경적이고 교통 체증 감소에도 도움이 되기 때문입니다.","私は休日は家で休むほうが好きです。平日は忙しいので、ゆっくり休んで次の週の準備をしたいからです。":"저는 휴일에는 집에서 쉬는 편이 좋습니다. 평일에는 바빠서 충분히 쉬고 다음 주를 준비하고 싶기 때문입니다.","私は旅行の前に計画を立てたほうがいいと思います。時間を有効に使えますし、大切な場所を見逃さずに済むからです。":"저는 여행 전에 계획을 세우는 편이 좋다고 생각합니다. 시간을 효율적으로 쓰고 중요한 장소도 놓치지 않을 수 있기 때문입니다.","すみません。注文した料理と違うようです。注文の内容を確認していただけますか。":"죄송합니다. 주문한 음식과 다른 것 같습니다. 주문 내용을 확인해 주시겠어요?","ごめんなさい。電車が遅れているので、十分ぐらい遅れます。":"미안해요. 전철이 늦어져서 10분 정도 늦겠습니다.","すみません、買った商品が壊れていました。交換できますか。":"죄송한데 산 물건이 고장 나 있었습니다. 교환할 수 있나요?","誘ってくれてありがとう。でも、予定があるので行けません。":"초대해 줘서 고마워요. 하지만 일정이 있어서 못 갑니다.","ごめんなさい。電車が遅れているので、十分ぐらい遅れそうです。少し待っていてください。":"미안해요. 전철이 늦어져서 10분 정도 늦을 것 같습니다. 조금 기다려 주세요.","すみません、駅へはどう行けばいいですか。":"죄송한데 역에는 어떻게 가면 되나요?","すみません、部屋が寒いので、暖房を確認していただけますか。":"죄송한데 방이 추워서 난방을 확인해 주시겠어요?","すみません、財布をなくしました。届いていませんか。":"죄송한데 지갑을 잃어버렸습니다. 접수된 것이 있나요?","すみません。駅に行きたいのですが、この道で合っていますか。道を教えていただけますか。":"죄송한데 역에 가고 싶은데 이 길이 맞나요? 길을 알려 주시겠어요?","申し訳ありませんが、会議の時間を変更してもよろしいでしょうか。":"죄송하지만 회의 시간을 변경해도 될까요?","よかったら、こちらに座ってください。":"괜찮으시면 여기에 앉으세요.","すみません。昨日買った商品が壊れていました。レシートもあるのですが、交換していただけますか。":"죄송한데 어제 산 물건이 고장 나 있었습니다. 영수증도 있는데 교환해 주시겠어요?","すみません、写真を撮っていただけますか。":"죄송한데 사진을 찍어 주시겠어요?","すみません。部屋がとても寒くて、暖房がうまく動いていないようです。確認していただけますか。":"죄송한데 방이 너무 춥고 난방이 제대로 작동하지 않는 것 같습니다. 확인해 주시겠어요?","すみません、注文した料理と違います。確認していただけますか。":"죄송한데 주문한 음식과 다릅니다. 확인해 주시겠어요?","申し訳ありませんが、別の予定が入ってしまいました。できれば会議の時間を変更してもよろしいでしょうか。":"죄송하지만 다른 일정이 생겼습니다. 가능하면 회의 시간을 변경해도 될까요?","誘ってくれてありがとう。でも、その日はもう予定があるので行けません。また今度ぜひ一緒に行きましょう。":"초대해 줘서 고마워요. 하지만 그날은 이미 일정이 있어서 못 갑니다. 다음에 꼭 함께 가요.","すみません。店の中で財布をなくしたようです。落とし物として届いていないか、確認していただけますか。":"죄송한데 가게 안에서 지갑을 잃어버린 것 같습니다. 분실물로 접수되었는지 확인해 주시겠어요?","よかったら、こちらの席に座ってください。私はもうすぐ降りますので、大丈夫です。":"괜찮으시면 이 자리에 앉으세요. 저는 곧 내리니까 괜찮습니다.","すみません。お忙しいところ申し訳ありませんが、ここで写真を一枚撮っていただけますか。":"바쁘신데 죄송하지만 여기서 사진 한 장 찍어 주시겠어요?","家を出たら雨が降り始めました。傘を持っていたので大丈夫でした。":"집을 나서자 비가 내리기 시작했습니다. 우산이 있어서 괜찮았습니다.","店で買い物をしましたが、カードが使えませんでした。現金で払いました。":"가게에서 쇼핑했지만 카드를 사용할 수 없어 현금으로 냈습니다.","カフェで本を読んでいたら、友達から電話が来ました。一緒に会うことにしました。":"카페에서 책을 읽다가 친구에게 전화가 왔습니다. 만나기로 했습니다.","犬と公園を散歩していたら雨が降りました。急いで家に帰りました。":"개와 공원을 산책하다가 비가 와서 급히 집에 돌아갔습니다.","駅に遅れそうだったので走りました。何とか電車に間に合いました。":"역에 늦을 것 같아서 뛰었습니다. 어떻게든 전철을 탈 시간에 맞췄습니다.","料理をしていたら少し焦がしてしまいました。でも、何とか食事を作りました。":"요리하다가 조금 태워 버렸지만 어떻게든 식사를 만들었습니다.","友達の誕生日にプレゼントを渡しました。とても喜んでくれたので、写真を撮りました。":"친구 생일에 선물을 건넸습니다. 매우 기뻐해 줘서 사진을 찍었습니다.","旅行の準備をして飛行機に乗りました。ホテルに着いてから観光しました。":"여행 준비를 하고 비행기를 탔습니다. 호텔에 도착한 후 관광했습니다.","パソコンが動かなくなりました。修理をお願いしたら、また使えるようになりました。":"컴퓨터가 작동하지 않게 되었습니다. 수리를 부탁하니 다시 쓸 수 있게 되었습니다.","天気がよかったので自転車で公園に行きました。きれいな花を見て写真を撮りました。":"날씨가 좋아 자전거로 공원에 갔습니다. 예쁜 꽃을 보고 사진을 찍었습니다."};
const SJPT_FURIGANA_KEYS=Object.keys(SJPT_FURIGANA_LEXICON).sort((a,b)=>b.length-a.length);
function sjptFurigana(t){
 const raw=String(t);let i=0,result='';
 while(i<raw.length){
  let match=null;
  for(const k of SJPT_FURIGANA_KEYS){if(raw.startsWith(k,i)){match=k;break;}}
  if(match){result+=`<ruby>${esc(match)}<rt>${esc(SJPT_FURIGANA_LEXICON[match])}</rt></ruby>`;i+=match.length;}
  else{result+=esc(raw[i]);i++;}
 }
 return result;
}

 ${audioOnly?(sjShowText?textBlock:'<p class="sub sj-hidden-note">지문은 기본적으로 숨겨져 있습니다. 먼저 음성으로 들어보세요.</p>'):textBlock}
 ${!listen&&x.part===2?'<p class="sub">그림을 보고 질문에 가장 알맞은 답을 고르세요.</p>':listen?'<p class="sub">방금 들은 일본어 문장의 한국어 뜻을 선택하세요.</p>':'<p class="sub">질문·상황에 가장 자연스러운 답변을 고르세요.</p>'}
 <div class="answers sj-answer-list">${choices.map((o,i)=>`<div class="sj-answer-row"><button class="choice ${sjSelected===o?'selected':''} ${sjChecked&&o===x.correct?'correct':''} ${sjChecked&&sjSelected===o&&o!==x.correct?'wrong':''}" data-sj-choice="${esc(o)}" ${sjChecked?'disabled':''}>${i+1}. <span class="sj-option-jp">${sjFuriganaVisible?sjptFurigana(o):esc(o)}</span>${sjChecked?`<span class="sj-option-translation">— ${esc(SJPT_OPTION_KO[o]||"")}</span>`:""}</button><button type="button" class="btn ghost sj-choice-audio" data-sj-option-tts="${i}" aria-label="${i+1}번 보기 듣기" title="${i+1}번 보기 듣기">🔊</button></div>`).join('')}</div>
 ${sjChecked?`<div class="notice ${sjSelected!==x.correct?'bad':''}"><strong>${sjSelected===x.correct?'정답입니다!':'오답입니다.'}</strong><p><strong>정답:</strong> ${sjFuriganaVisible?sjptFurigana(x.correct):esc(x.correct)}</p>${x.questionMeaning?`<p><strong>질문 의미:</strong> ${esc(x.questionMeaning)}</p>`:""}${x.answerMeaning?`<p><strong>답변 의미:</strong> ${esc(x.answerMeaning)}</p>`:""}<p><strong>해설:</strong> ${esc(x.explanation)}</p>${listen?`<p><strong>들은 문장:</strong> ${esc(x.jp)}</p><p><strong>뜻:</strong> ${esc(x.ko)}</p>`:x.part===2?`<p>뜻: ${esc(x.ko)}</p>`:''}</div>`:''}
 <div class="actions">${sjChecked?'<button class="btn primary" data-sj-next="1">다음 문제 →</button>':`<button class="btn primary" data-sj-check="1" ${!sjSelected?'disabled':''}>정답 확인</button>`}<button class="btn ghost" data-sj-next="1">문제 바꾸기</button></div></div>
 <p class="sub">${listen?'청해 120문제':`SJPT ${sjPart==='all'?'2~7부 전체 120':sjPart+'부 '+(Number(sjPart)<=4?30:10)}문제`} · 문제별 보기 순서는 고정되며 문제 출제 순서는 무작위입니다.</p>`);
}
function shuffleStable(arr,key){const seed=[...key].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,1);return [...arr].sort((a,b)=>hashWord(a,seed)-hashWord(b,seed))}

function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home,quiz,vocab,review,counter,sjpt:sjptPage,settings}[tab])()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.quizFurigana){quizFuriganaVisible=!quizFuriganaVisible;render()}else if(b.dataset.sjOptionTts!==undefined){const opts=shuffleStable(sjQuestion.opts,sjQuestion.id);const option=opts[Number(b.dataset.sjOptionTts)];if(option!==undefined)speech(option)}else if(b.dataset.sjFurigana){sjFuriganaVisible=!sjFuriganaVisible;sjptPage()}else if(b.dataset.sjMode){sjMode=b.dataset.sjMode;sjAsked.clear();sjQuestion=null;sjptPage()}else if(b.dataset.sjPart){sjPart=b.dataset.sjPart;sjAsked.clear();sjQuestion=null;sjptPage()}else if(b.dataset.sjChoice!==undefined&&!sjChecked){sjSelected=b.dataset.sjChoice;sjptPage()}else if(b.dataset.sjCheck){if(sjSelected){sjChecked=true;sjCounts.n++;if(sjSelected===sjQuestion.correct)sjCounts.correct++;sjptPage()}}else if(b.dataset.sjNext){sjPick();sjptPage()}else if(b.dataset.sjTranscript){sjShowText=!sjShowText;sjptPage()}else if(b.dataset.sjTts){speech(sjQuestion.jp)}else if(b.dataset.sjReset){if(confirm('SJPT 연습 세션의 정답 수와 문제 수를 초기화할까요?')){sjCounts={n:0,correct:0};sjAsked.clear();sjQuestion=null;tab='home';render()}}else if(b.dataset.home){reviewActive=false;tab='home';render()}else if(b.dataset.tab){reviewActive=false;tab=b.dataset.tab;render()}else if(b.dataset.go){reviewActive=false;tab=b.dataset.go;render()}else if(b.dataset.level){vocabLevel=b.dataset.level;render()}else if(b.dataset.reviewFilter){reviewFilter=b.dataset.reviewFilter;render()}else if(b.dataset.startReview){startReview()}else if(b.dataset.stopReview){reviewActive=false;q=null;tab='review';render()}else if(b.dataset.sessionReset){if(confirm('단어 퀴즈의 정답·오답 기록, 누적 정답률, 오답노트 및 현재 세션을 모두 초기화할까요?\\n\\n단어장과 익숙함 표시, 설정은 유지됩니다. 이 작업은 되돌릴 수 없습니다.')){state.stats={};state.history=[];state.mistakes=[];save();session={n:0,correct:0};q=null;selected='';revealed=false;reviewActive=false;reviewQueue=[];reviewCursor=0;tab='home';render()}}else if(b.dataset.choice!==undefined&&!revealed){selected=b.dataset.choice;render()}else if(b.id==='check'){if(!selected&&q.actual!=='sentence')return;verify()}else if(b.dataset.next){next()}else if(b.dataset.new){next()}else if(b.dataset.shuffle){vocabSort='shuffle';vocabShuffle=Math.floor(Math.random()*1000000000);render()}else if(b.dataset.hide){hideMeanings=!hideMeanings;shownMeanings.clear();render()}else if(b.dataset.reveal){shownMeanings.add(b.dataset.reveal);render()}else if(b.dataset.conceal){shownMeanings.delete(b.dataset.conceal);render()}else if(b.dataset.known){const w=WORDS.find(x=>x.id===b.dataset.known);state.known[w.id]=!(state.known[w.id]??w.known);save();render()}else if(b.dataset.tts){speech(b.dataset.tts)}else if(b.dataset.counterquiz){mode='counter';tab='quiz';next()}else if(b.dataset.export){const blob=new Blob([JSON.stringify({app:'sjpt-lab',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sjpt-lab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.dataset.reset){if(confirm('학습 기록과 익숙함 표시를 모두 초기화할까요?')){state={stats:{},history:[],known:{},mistakes:[],settings:state.settings};save();q=null;session={n:0,correct:0};render()}}});
document.addEventListener('input',e=>{if(e.target.id==='answer'){selected=e.target.value;let b=document.getElementById('check');if(b)b.disabled=!selected.trim()}else if(e.target.id==='search'){filterText=e.target.value;let pos=e.target.selectionStart;vocab();let inp=document.getElementById('search');inp.focus();inp.setSelectionRange(pos,pos)}else if(e.target.id==='rate'){state.settings.ttsRate=+e.target.value;document.getElementById('rateText').textContent=e.target.value+'×';save()}});
document.addEventListener('change',async e=>{if(e.target.id==='mode'){mode=e.target.value;next()}else if(e.target.id==='vocabsort'){vocabSort=e.target.value;if(vocabSort==='shuffle')vocabShuffle=Math.floor(Math.random()*1000000000);render()}else if(e.target.id==='catfilter'){filterCat=e.target.value;render()}else if(e.target.id==='counterfilter'){counterGroup=e.target.value;render()}else if(e.target.id==='furigana'){state.settings.furigana=e.target.checked;save();render()}else if(e.target.id==='size'){state.settings.sessionSize=+e.target.value;save()}else if(e.target.id==='import'){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='sjpt-lab'||!data.state||typeof data.state!=='object'||Array.isArray(data.state)||!data.state.stats||!Array.isArray(data.state.history)||!data.state.settings)throw Error('올바른 SJPT LAB 백업이 아닙니다.');if(!confirm('현재 학습 기록을 백업 파일로 교체할까요?'))return;state=data.state;state.known=state.known||{};state.mistakes=Array.isArray(state.mistakes)?state.mistakes:[];state.settings=Object.assign({furigana:true,ttsRate:.86,sessionSize:20},state.settings);save();q=null;alert('복원했습니다.');render()}catch(err){alert('복원 실패: '+err.message)}}});
document.querySelector('.brand').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reviewActive=false;tab='home';render()}});document.querySelector('.brand').addEventListener('click',()=>{reviewActive=false;tab='home';render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'&&!revealed){verify()}});render();
</script></body></html>
