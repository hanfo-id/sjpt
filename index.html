function record(ok){let s=state.stats[q.w.id]||{right:0,wrong:0,streak:0};if(ok){s.right++;s.streak++}else{s.wrong++;s.streak=0}s.last=Date.now();state.stats[q.w.id]=s;state.history.push({time:Date.now(),id:q.w.id,ok,kind:q.actual});if(state.history.length>3000)state.history=state.history.slice(-3000);session.n++;if(ok)session.correct++;save()}
function verify(){if(revealed||!q)return;let ok=normalize(selected)===normalize(q.correct);if(q.actual==='reverse'&&normalize(selected)===normalize(q.w.jp))ok=true;revealed=true;
 if(q.mistakeId){const m=state.mistakes.find(x=>x.id===q.mistakeId);if(m){m.attempts=(m.attempts||0)+1;if(ok){m.resolved=true;m.resolvedAt=Date.now()}else{m.answer=selected;m.time=Date.now()}}}
 else if(!ok)storeMistake(q,selected);

function explanation(q){
 const w=q.w;
 if(q.actual==='sentence')return `<strong>문장 해설</strong><p>${esc(q.sentenceExplanation||'문맥과 문법을 함께 확인하세요.')}</p><p><strong>완성 문장:</strong> ${esc(w.jp.replace('（　）',q.correct))}</p><p class="sub">${esc(w.ko)}</p>`;
 if(q.actual==='incorrect'){
  const kinds=['nai','te','ta','masu','potential','tara'];
  const names={nai:'부정',te:'연결',ta:'과거',masu:'정중',potential:'가능',tara:'조건'};
  const lines=kinds.filter(k=>q.opts.some(o=>o.startsWith(conjugate(w,k)+' · '))).map(k=>{
   const form=conjugate(w,k),expected=conjugationMeaning(w.ko,k);
   const wrong=k===q.wrongKind;
   return `<div class="explain-line ${wrong?'explain-highlight':''}"><strong>${esc(form)}</strong> — ${esc(expected)}${wrong?' <strong>← 이 활용형의 올바른 의미</strong>':''}</div>`;
  });
  return `<strong>왜 틀렸나요?</strong><p>${esc(q.correct)}는 일본어 활용형과 의미가 서로 맞지 않습니다. 해당 활용형의 실제 문법적 의미를 아래에서 비교하세요.</p>${lines.join('')}<p class="sub">원형 ${esc(w.jp)} (${esc(w.kana)}) · ${esc(w.ko)} / ${esc(w.group)}그룹 동사</p>`;
 }
 if(q.actual==='conj'){
  const names={nai:'부정',te:'연결',ta:'과거',masu:'정중',potential:'가능',tara:'조건'};
  return `<strong>활용 해설</strong><p>${esc(w.kana)} → <strong>${esc(q.correct)}</strong> (${names[q.kind]}: ${conjugationMeaning(w.ko,q.kind)})</p><p class="sub">${esc(w.group)}그룹 동사입니다. 기본형의 끝부분이 해당 활용 규칙에 맞춰 변합니다.</p>`;
 }
 if(q.actual==='counter')return `<strong>발음 해설</strong><p>${esc(w.ko)}의 올바른 읽기는 <strong>${esc(w.kana)}</strong>입니다. 조수사는 숫자와 단위의 조합에 따라 발음이 달라질 수 있으므로 소리 내어 복습해 보세요.</p>`;
 if(q.actual==='reverse')return `<strong>단어 해설</strong><p>${esc(w.ko)} → <strong>${esc(w.jp)} (${esc(w.kana)})</strong>입니다. 한자 표기와 히라가나 읽기를 함께 기억하세요.</p>`;
 return `<strong>단어 해설</strong><p><strong>${esc(w.jp)} (${esc(w.kana)})</strong>의 뜻은 <strong>${esc(w.ko)}</strong>입니다. 다른 보기와 구분해 기억해 보세요.</p>`;
}

function home(){const attempted=Object.keys(state.stats).length,total=state.history.length,good=state.history.filter(h=>h.ok).length,wrong=Object.values(state.stats).filter(s=>s.wrong>0&&s.streak<2).length;section(`<div class="hero"><div class="eyebrow">YOUR JAPANESE, EVERY DAY</div><h1>오늘의 일본어 학습</h1><p>어휘와 활용형을 복습하고, 헷갈리는 발음을 다시 확인하세요.</p><div class="actions"><button class="btn primary" data-go="quiz">학습 시작 →</button><button class="btn" data-go="sjpt">SJPT 문제 풀기</button></div></div><div class="grid home-stats"><div class="card"><div class="statlabel">수록 학습 항목</div><div class="stat">${WORDS.length}</div><div class="sub">단어·표현·조수사 매핑</div></div><div class="card"><div class="statlabel">학습해 본 항목</div><div class="stat">${attempted}</div><div class="sub">${Math.round(attempted/WORDS.length*100)}% 학습 시작</div></div><div class="card"><div class="statlabel">누적 정답률</div><div class="stat">${total?Math.round(good/total*100):0}%</div><div class="sub">${total}문제 중 ${good}문제 정답</div></div></div><div class="section-title">오늘의 학습 로드맵</div><div class="split"><div class="card"><div class="row"><strong>적응형 문제 추천</strong><span class="pill orange">취약 ${wrong}개</span></div><p class="sub">이미 아는 25개 어휘는 낮은 빈도로 등장합니다. 오답을 내면 출제 비중이 올라갑니다.</p><div class="progress"><div style="width:${Math.min(100,session.n/state.settings.sessionSize*100)}%"></div></div><p class="sub">현재 세션 ${session.n} / ${state.settings.sessionSize}문제</p><div class="actions"><button class="btn primary" data-go="quiz">오늘의 문제 풀기</button><button class="btn" data-go="review">오답노트</button><button class="btn ghost" data-session-reset="1">단어 퀴즈 기록 초기화</button><button class="btn ghost" data-sj-reset="1">SJPT 세션 초기화</button></div></div><div class="card"><strong>추천 학습 순서</strong><p class="sub">① 혼합 퀴즈 20문제<br>② 조수사 발음 5문제<br>③ SJPT 청해·객관식 5문제</p><button class="btn" data-go="counter">조수사 연습하기</button></div></div>`)}


function quizChoiceAudio(o){
 if(q.actual==='ko2jp'){const match=WORDS.find(w=>w.jp===o);return match?match.kana:o;}
 if(q.actual==='meaning'){
  const match=WORDS.find(w=>w.ko===o);
  return match?match.kana:'';
 }
 if(q.actual==='incorrect')return String(o).split(' · ')[0];
 return o;
}
function quizChoiceDisplay(o){
 const raw=String(o);
 const gloss=quizChoiceGloss(o);
 // Only Japanese text receives furigana; never pass already-escaped HTML to ruby conversion.
 const jpText=quizFuriganaVisible && /[\u3040-\u30ff\u3400-\u9fff]/.test(raw) && !/^[\uac00-\ud7a3\s]+$/.test(raw)
   ? sjptFurigana(raw) : esc(raw);
 return `<span class="quiz-option-text">${jpText}</span>${revealed&&gloss?` <span class="choice-gloss">— ${esc(gloss)}</span>`:''}`;
}

let openExampleId=null;let exampleFilter="all";
function exampleCard(w){const d=REAL_EXAMPLES[w.jp];if(!d)return "";const opened=openExampleId===w.id;const label=d.type==="song"?"음악":"애니";const head=`<button class="word-action example-toggle" data-example="${esc(w.id)}" aria-expanded="${opened}">${d.type==="song"?"♫":"▣"} ${label} 예문 ${opened?"⌃":"⌄"}</button>`;if(!opened)return head;const i=d.text.indexOf(d.match);const line=state.settings.furigana?sjptFurigana(d.text):esc(d.text);const reading=EXAMPLE_KOREAN_READING[w.jp];return head+`<div class="example-content"><div class="example-source">${esc(d.artist)} · ${esc(d.source)}</div><div class="example-jp">${line}</div>${reading?`<div class="example-reading" aria-label="한국어 발음">${esc(reading)}</div>`:""}<div class="example-translation">${esc(d.translation)}</div><div class="example-foot"><button class="word-action" data-tts="${esc(d.text)}">▶ 듣기</button><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${d.type==="anime"?"대사 검색 ↗":"원문 출처 ↗"}</a></div></div>`}

function vocab(){let data=WORDS.filter(w=>(exampleFilter==="all"||(exampleFilter==="none"?!REAL_EXAMPLES[w.jp]:REAL_EXAMPLES[w.jp]?.type===exampleFilter))&&levelMatch(w,vocabLevel)&&(filterCat==='all'||w.cat===filterCat)&&(`${w.jp} ${w.kana} ${w.ko}`).toLowerCase().includes(filterText.toLowerCase()));if(vocabSort==='kana')data.sort((a,b)=>a.kana.localeCompare(b.kana,'ja'));else if(vocabSort==='shuffle')data.sort((a,b)=>hashWord(a.id,vocabShuffle)-hashWord(b.id,vocabShuffle));section(`<div class="row"><div><div class="eyebrow">WORD LIBRARY</div><h2 style="margin:3px 0">나만의 단어장</h2></div><span class="pill">${data.length}개 표시</span></div><p class="sub">'익숙한 단어'는 출제 빈도를 줄이고, '학습 완료'는 복습 문제집에 포함합니다.</p><div class="level-switch" role="group" aria-label="단어 수준 선택"><button class="btn ${vocabLevel==='all'?'primary':''}" data-level="all">전체</button><button class="btn ${vocabLevel==='basic'?'primary':''}" data-level="basic">기본</button><button class="btn ${vocabLevel==='beginner'?'primary':''}" data-level="beginner">초급</button><button class="btn ${vocabLevel==='studied'?'primary':''}" data-level="studied">공부했음 (${WORDS.filter(isStudied).length})</button></div><div class="vocab-search-controls"><select id="catfilter" class="select" style="max-width:190px"><option value="all">전체 품사</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${filterCat===k?'selected':''}>${v}</option>`).join('')}</select><input id="search" class="textinput" style="max-width:300px" placeholder="단어·읽기·뜻 검색" value="${esc(filterText)}"></div><div class="example-filters" role="group" aria-label="작품 예문 필터"><span class="example-filter-label">작품 예문</span>${[["all","전체"],["anime","애니메이션"],["song","음악"],["none","예문 없음"]].map(([k,v])=>`<button class="example-filter-btn ${exampleFilter===k?"active":""}" data-example-filter="${k}" aria-pressed="${exampleFilter===k}">${v}</button>`).join("")}</div><div class="vocab-tools"><select id="vocabsort" class="select"><option value="kana" ${vocabSort==='kana'?'selected':''}>히라가나 순</option><option value="shuffle" ${vocabSort==='shuffle'?'selected':''}>랜덤 셔플</option></select><button class="btn" data-shuffle="1">다시 섞기</button><button class="btn" data-hide="1">${hideMeanings?'뜻 전체 보기':'뜻 가리기'}</button></div><div class="tablewrap" style="margin-top:15px"><table class="vocab"><thead><tr><th>수준</th><th>일본어 / 읽기</th><th>뜻</th><th>숙련도</th><th>학습 관리</th></tr></thead><tbody>${data.map(w=>{const s=state.stats[w.id]||{},k=state.known[w.id]??w.known;return `<tr><td><span class="pill">${w.id.startsWith('beginner_')?'초급':'기본'}</span></td><td><strong>${esc(w.jp)}</strong><small>${esc(w.kana)}</small></td><td>${hideMeanings&&!shownMeanings.has(w.id)?`<button class="meaning-reveal" data-reveal="${w.id}">뜻 확인</button>`:`<span class="meaning-visible">${esc(w.ko)} <button class="meaning-reveal" data-conceal="${w.id}">다시 가리기</button></span>`}</td><td class="vocab-status"><span class="pill ${s.streak>=3?'green':s.wrong&&s.streak<2?'orange':''}">${s.streak>=3?'숙달':s.wrong&&s.streak<2?'복습 필요':k?'익숙함':'학습 중'}</span></td><td><div class="word-actions"><button class="word-action ${k?'is-on':''}" data-known="${w.id}" aria-pressed="${k}">${k?'✓ 익숙한 단어':'○ 익숙한 단어'}</button><button class="word-action ${isStudied(w)?'is-on':''}" data-studied="${w.id}" aria-pressed="${isStudied(w)}">${isStudied(w)?'✓ 학습 완료':'○ 학습 완료'}</button>${exampleCard(w)}</div></td></tr>`}).join('')}</tbody></table></div>`)}
function review(){
 const all=state.mistakes||[],pending=all.filter(m=>!m.resolved),data=all.filter(m=>reviewFilter==='all'||(reviewFilter==='open'?!m.resolved:m.resolved));
 const grouped=new Map();for(const m of data){const w=WORDS.find(x=>x.id===m.wordId)||(m.actual==='sentence'?SENTENCE_QUESTIONS.find(x=>x.id===m.wordId):null)||m.snapshot?.w;if(!w)continue;let item=grouped.get(w.id);if(!item){item={w,items:[]};grouped.set(w.id,item)}item.items.push(m)}
 const kinds={meaning:'뜻 선택',reverse:'일본어 읽기',conj:'동사 활용',counter:'조수사 발음',incorrect:'잘못된 활용 찾기',sentence:'문장 빈칸'};
 const rows=[...grouped.values()].map(({w,items})=>{if(['sjpt','listen'].includes(w.cat))return sjReviewCard(w,items);const examples=w.id.startsWith('sentence_')?`<div class="review-example"><span>${esc(w.jp.replace('（　）',items[0].correct))}</span><span>${esc(w.ko)}</span></div><p class="sub">${esc(items[0].sentenceExplanation||'문장 뜻과 활용을 확인하세요.')}</p>`:w.cat==='verb'&&w.group?['nai','te','ta','potential','tara'].map(k=>`<div class="review-example"><span>${esc(conjugate(w,k))}</span><span>${esc(conjugationMeaning(w.ko,k))}</span></div>`).join(''):`<div class="review-example"><span>${esc(w.jp)}（${esc(w.kana)}）</span><span>${esc(w.ko)}</span></div>`;
 return `<article class="card review-card"><div class="row"><div><div class="review-word">${ruby(w)}</div><div class="reading">${esc(w.kana)}</div><div class="word-meaning">${esc(w.ko)}</div></div><span class="pill orange">${items.length}건</span></div><button class="btn small ghost" data-tts="${esc(w.kana)}">▶ 발음 듣기</button><details class="review-details"><summary>예시 활용 및 해설 보기</summary><div class="review-examples">${examples}</div><p class="sub">문제 유형: ${[...new Set(items.map(x=>kinds[x.actual]||x.actual))].join(' · ')}</p><p class="sub">최근 오답: ${esc(items[0].answer||'미입력')} / 정답: ${esc(items[0].correct)}</p></details></article>`}).join('');
 section(`<div class="row"><div><div class="eyebrow">REVIEW</div><h2 style="margin:3px 0">오답노트</h2></div><span class="pill">미해결 ${pending.length}건</span></div><p class="sub">틀린 문제를 저장하고, 같은 문제를 다시 풀어 정답이면 복습 완료로 표시합니다. 단어별로 활용 예시도 확인할 수 있습니다.</p><div class="review-actions"><button class="btn primary" data-start-review="1" ${pending.length?'':'disabled'}>틀린 문제 다시 풀기 (${pending.length})</button><button class="btn ${reviewFilter==='open'?'primary':''}" data-review-filter="open">미해결</button><button class="btn ${reviewFilter==='done'?'primary':''}" data-review-filter="done">완료</button><button class="btn ${reviewFilter==='all'?'primary':''}" data-review-filter="all">전체</button></div><div class="review-list">${rows||'<div class="card sub">해당하는 오답이 없습니다. 문제를 풀다가 틀리면 여기에 저장됩니다.</div>'}</div>`);

function counter(){const groups=['all',...new Set(WORDS.filter(w=>w.cat==='counter').map(w=>w.counter))];let data=WORDS.filter(w=>w.cat==='counter'&&(counterGroup==='all'||w.counter===counterGroup));section(`<div class="eyebrow">PRONUNCIATION DRILLS</div><h2 style="margin:3px 0">조수사 발음 집중 훈련</h2><p class="sub">한국어 수량과 일본어 읽기를 직접 연결합니다. 같은 '1개'라도 일반 개수와 個(こ)는 읽기가 다릅니다.</p><div class="actions"><select id="counterfilter" class="select" style="max-width:220px">${groups.map(g=>`<option value="${g}" ${g===counterGroup?'selected':''}>${g==='all'?'전체 조수사':g}</option>`).join('')}</select><button class="btn primary" data-counterquiz="1">조수사 퀴즈 풀기</button></div><div class="grid" style="margin-top:15px">${data.map(w=>`<div class="card"><div class="row"><span class="pill">${esc(w.counter)}</span><button class="btn small ghost" data-tts="${esc(w.kana)}">▶ 듣기</button></div><div class="sub" style="margin-top:12px">${esc(w.ko)}</div><div class="counter-kana">${esc(w.kana)}</div></div>`).join('')}</div>`)}
function settings(){section(`<div class="eyebrow">SETTINGS & BACKUP</div><h2 style="margin:3px 0">학습 환경 설정</h2><div class="split"><div class="card stack"><label class="row"><strong>후리가나 항상 표시</strong><input type="checkbox" id="furigana" ${state.settings.furigana?'checked':''}></label><div class="sub">문제와 단어장에서 한자 읽기를 표시합니다. 단어에 읽기가 제공된 경우 적용됩니다.</div><label>음성 속도 <strong id="rateText">${state.settings.ttsRate}×</strong><input style="width:100%" id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${state.settings.ttsRate}"></label><button class="btn" data-tts="こんにちは。今日は日本語を勉強しましょう。">▶ 일본어 음성 테스트</button><label>1회 학습 목표<select class="select" id="size">${[10,20,30,40].map(n=>`<option value="${n}" ${n===state.settings.sessionSize?'selected':''}>${n}문제</option>`).join('')}</select></label></div><div class="card stack"><strong>데이터 백업·복원</strong><p class="sub">학습 기록은 이 브라우저의 localStorage에 자동 저장됩니다. 다른 기기로 이동할 때 JSON 파일을 사용하세요.</p><button class="btn primary" data-export="1">↓ 학습 기록 JSON 백업</button><label class="btn" style="text-align:center">↑ JSON 백업 복원<input id="import" type="file" accept="application/json,.json" class="hidden"></label><button class="btn danger" data-reset="1">학습 기록 초기화</button></div></div>`)}

것과 혼자 여행하는 것 중 어느 쪽이 좋은지 묻습니다.","answerMeaning":"친구와 여행하는 편이 좋다고 생각합니다. 함께 즐거운 추억을 만들 수 있고, 어려울 때 서로 도울 수 있기 때문입니다."},{"id":"sj5_2","part":5,"jp":"都会と田舎ではどちらに住みたいですか。","correct":"私は都会に住みたいです。交通が便利ですし、買い物や病院に行くのも簡単だからです。","opts":["私は都会に住みたいです。交通が便利ですし、買い物や病院に行くのも簡単だからです。","いいと思います。通勤時間を減らせるからです。","はい、そう思います。健康にいいからです。","いいと思います。車より環境にやさしいからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"도시와 시골 중 어디에 살고 싶은지 묻습니다.","answerMeaning":"저는 도시에 살고 싶습니다. 교통이 편리하고 쇼핑이나 병원 이용도 쉽기 때문입니다."},{"id":"sj5_3","part":5,"jp":"家で働くことについてどう思いますか。","correct":"私は家で働くことに賛成です。通勤時間を減らせますし、その時間を家族や趣味のために使えるからです。","opts":["私は家で働くことに賛成です。通勤時間を減らせますし、その時間を家族や趣味のために使えるからです。","映画のほうが好きです。短い時間で楽しめるからです。","インターネットのほうが便利だと思います。時間を節約できます。","家で休むほうが好きです。ゆっくりできるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"재택근무에 대한 의견을 묻습니다.","answerMeaning":"재택근무에 찬성합니다. 통근 시간을 줄일 수 있고, 그 시간을 가족이나 취미에 쓸 수 있기 때문입니다."},{"id":"sj5_4","part":5,"jp":"本と映画ではどちらが好きですか。","correct":"私は映画のほうが好きです。短い時間で物語を楽しめますし、映像や音楽も一緒に楽しめるからです。","opts":["私は映画のほうが好きです。短い時間で物語を楽しめますし、映像や音楽も一緒に楽しめるからです。","はい、そう思います。健康にいいからです。","はい、いいと思います。小さいころから慣れることができるからです。","はい、立てたほうがいいです。時間を有効に使えるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"책과 영화 중 어느 쪽을 좋아하는지 묻습니다.","answerMeaning":"저는 영화를 더 좋아합니다. 짧은 시간에 이야기를 즐길 수 있고, 영상과 음악도 함께 즐길 수 있기 때문입니다."},{"id":"sj5_5","part":5,"jp":"運動は毎日したほうがいいと思いますか。","correct":"私は毎日運動することに賛成です。健康を維持できますし、ストレスも減らせるからです。","opts":["私は毎日運動することに賛成です。健康を維持できますし、ストレスも減らせるからです。","インターネットのほうが便利だと思います。時間を節約できます。","いいと思います。車より環境にやさしいからです。","友達と旅行するほうがいいと思います。一緒に楽しめるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"매일 운동하는 것이 좋은지 의견을 묻습니다.","answerMeaning":"저는 매일 운동하는 것에 찬성합니다. 건강을 유지할 수 있고 스트레스도 줄일 수 있기 때문입니다."},{"id":"sj5_6","part":5,"jp":"買い物は店とインターネットではどちらが便利ですか。","correct":"私はインターネットで買い物するほうが便利だと思います。家でいつでも注文できますし、時間を節約できるからです。","opts":["私はインターネットで買い物するほうが便利だと思います。家でいつでも注文できますし、時間を節約できるからです。","はい、いいと思います。小さいころから慣れることができるからです。","家で休むほうが好きです。ゆっくりできるからです。","都会に住みたいです。交通が便利だからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"매장과 인터넷 쇼핑 중 어느 쪽이 편리한지 묻습니다.","answerMeaning":"인터넷 쇼핑이 더 편리하다고 생각합니다. 집에서 언제든 주문할 수 있고 시간을 절약할 수 있기 때문입니다."},{"id":"sj5_7","part":5,"jp":"子供は外国語を早く勉強したほうがいいですか。","correct":"私は賛成です。子供のころから外国語に慣れることができますし、ほかの国の文化も学べるからです。","opts":["私は賛成です。子供のころから外国語に慣れることができますし、ほかの国の文化も学べるからです。","いいと思います。車より環境にやさしいからです。","はい、立てたほうがいいです。時間を有効に使えるからです。","いいと思います。通勤時間を減らせるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"아이들이 일찍 외국어를 배우는 것이 좋은지 묻습니다.","answerMeaning":"저는 찬성합니다. 어릴 때부터 외국어에 익숙해질 수 있고 다른 나라의 문화도 배울 수 있기 때문입니다."},{"id":"sj5_8","part":5,"jp":"公共交通機関を利用することについてどう思いますか。","correct":"私は公共交通機関を利用するのはいいと思います。車より環境にやさしいですし、渋滞を減らすことにも役立つからです。","opts":["私は公共交通機関を利用するのはいいと思います。車より環境にやさしいですし、渋滞を減らすことにも役立つからです。","家で休むほうが好きです。ゆっくりできるからです。","友達と旅行するほうがいいと思います。一緒に楽しめるからです。","映画のほうが好きです。短い時間で楽しめるからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"대중교통 이용에 대한 의견을 묻습니다.","answerMeaning":"대중교통 이용은 좋다고 생각합니다. 자동차보다 환경에 좋고 교통 체증을 줄이는 데 도움이 되기 때문입니다."},{"id":"sj5_9","part":5,"jp":"休日は家で休むのと外出するのではどちらがいいですか。","correct":"私は休日は家で休むほうが好きです。平日は忙しいので、ゆっくり休んで次の週の準備をしたいからです。","opts":["私は休日は家で休むほうが好きです。平日は忙しいので、ゆっくり休んで次の週の準備をしたいからです。","はい、立てたほうがいいです。時間を有効に使えるからです。","都会に住みたいです。交通が便利だからです。","はい、そう思います。健康にいいからです。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"휴일에 집에서 쉬는 것과 외출하는 것 중 무엇이 좋은지 묻습니다.","answerMeaning":"저는 집에서 쉬는 편이 좋습니다. 평일에 바쁘기 때문에 휴일에는 충분히 쉬면서 다음 주를 준비하고 싶기 때문입니다."},{"id":"sj5_10","part":5,"jp":"旅行の前に計画を立てるべきだと思いますか。","correct":"私は旅行の前に計画を立てたほうがいいと思います。時間を有効に使えますし、大切な場所を見逃さずに済むからです。","opts":["私は旅行の前に計画を立てたほうがいいと思います。時間を有効に使えますし、大切な場所を見逃さずに済むからです。","友達と旅行するほうがいいと思います。一緒に楽しめるからです。","いいと思います。通勤時間を減らせるからです。","インターネットのほうが便利だと思います。時間を節約できます。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"의견을 먼저 밝히고 이유를 두 가지 연결하는 답변입니다. 「〜と思います」는 의견, 「〜し」는 이유의 나열, 「〜からです」는 근거를 나타냅니다.","questionMeaning":"여행 전에 계획을 세워야 하는지 묻습니다.","answerMeaning":"저는 계획을 세우는 편이 좋다고 생각합니다. 시간을 효율적으로 쓸 수 있고 중요한 장소를 놓치지 않을 수 있기 때문입니다."},{"id":"sj6_1","part":6,"jp":"レストランで注文と違う料理が来ました。何と言いますか。","correct":"すみません。注文した料理と違うようです。注文の内容を確認していただけますか。","opts":["すみません。注文した料理と違うようです。注文の内容を確認していただけますか。","ごめんなさい。電車が遅れているので、十分ぐらい遅れます。","すみません、買った商品が壊れていました。交換できますか。","誘ってくれてありがとう。でも、予定があるので行けません。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"주문한 음식과 다른 음식이 나왔을 때 직원에게 정중하게 확인을 요청하는 상황입니다.","answerMeaning":"실례합니다. 제가 주문한 음식과 다른 것 같습니다. 주문 내용을 확인해 주실 수 있을까요?"},{"id":"sj6_2","part":6,"jp":"約束に遅れそうです。友達に何と言いますか。","correct":"ごめんなさい。電車が遅れているので、十分ぐらい遅れそうです。少し待っていてください。","opts":["ごめんなさい。電車が遅れているので、十分ぐらい遅れそうです。少し待っていてください。","すみません、駅へはどう行けばいいですか。","すみません、部屋が寒いので、暖房を確認していただけますか。","すみません、財布をなくしました。届いていませんか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"약속에 늦을 것 같아서 친구에게 이유와 예상 지각 시간을 알려주는 상황입니다.","answerMeaning":"미안해요. 전철이 지연되어 약 10분 늦을 것 같아요. 먼저 기다려 주세요."},{"id":"sj6_3","part":6,"jp":"道に迷いました。通行人に何と言いますか。","correct":"すみません。駅に行きたいのですが、この道で合っていますか。道を教えていただけますか。","opts":["すみません。駅に行きたいのですが、この道で合っていますか。道を教えていただけますか。","すみません、買った商品が壊れていました。交換できますか。","申し訳ありませんが、会議の時間を変更してもよろしいでしょうか。","よかったら、こちらに座ってください。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"길을 잃어 지나가는 사람에게 역까지 가는 길을 묻는 상황입니다.","answerMeaning":"실례합니다. 역에 가고 싶은데 이 길로 가면 될까요? 길을 알려 주실 수 있나요?"},{"id":"sj6_4","part":6,"jp":"買った商品が壊れていました。店員に何と言いますか。","correct":"すみません。昨日買った商品が壊れていました。レシートもあるのですが、交換していただけますか。","opts":["すみません。昨日買った商品が壊れていました。レシートもあるのですが、交換していただけますか。","すみません、部屋が寒いので、暖房を確認していただけますか。","誘ってくれてありがとう。でも、予定があるので行けません。","すみません、写真を撮っていただけますか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"구입한 물건이 고장 나서 직원에게 교환을 요청하는 상황입니다.","answerMeaning":"실례합니다. 어제 산 상품이 고장 나 있었습니다. 영수증도 있는데 교환할 수 있을까요?"},{"id":"sj6_5","part":6,"jp":"ホテルの部屋が寒いです。フロントに何と言いますか。","correct":"すみません。部屋がとても寒くて、暖房がうまく動いていないようです。確認していただけますか。","opts":["すみません。部屋がとても寒くて、暖房がうまく動いていないようです。確認していただけますか。","申し訳ありませんが、会議の時間を変更してもよろしいでしょうか。","すみません、財布をなくしました。届いていませんか。","すみません、注文した料理と違います。確認していただけますか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"호텔 객실이 추워서 프런트에 난방 점검을 부탁하는 상황입니다.","answerMeaning":"실례합니다. 방이 너무 추운데 난방이 잘 작동하지 않는 것 같습니다. 확인해 주실 수 있나요?"},{"id":"sj6_6","part":6,"jp":"会議の時間を変更したいです。何と言いますか。","correct":"申し訳ありませんが、別の予定が入ってしまいました。できれば会議の時間を変更してもよろしいでしょうか。","opts":["申し訳ありませんが、別の予定が入ってしまいました。できれば会議の時間を変更してもよろしいでしょうか。","誘ってくれてありがとう。でも、予定があるので行けません。","よかったら、こちらに座ってください。","ごめんなさい。電車が遅れているので、十分ぐらい遅れます。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"회의 시간을 바꾸고 싶어서 상대방에게 정중히 양해를 구하는 상황입니다.","answerMeaning":"죄송하지만 다른 일정이 생겼습니다. 가능하다면 회의 시간을 변경해도 괜찮을까요?"},{"id":"sj6_7","part":6,"jp":"友達から誘われましたが、行けません。何と言いますか。","correct":"誘ってくれてありがとう。でも、その日はもう予定があるので行けません。また今度ぜひ一緒に行きましょう。","opts":["誘ってくれてありがとう。でも、その日はもう予定があるので行けません。また今度ぜひ一緒に行きましょう。","すみません、財布をなくしました。届いていませんか。","すみません、写真を撮っていただけますか。","すみません、駅へはどう行けばいいですか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"친구의 초대를 거절하면서 감사와 이유를 함께 전하는 상황입니다.","answerMeaning":"초대해 줘서 고마워요. 하지만 그날은 이미 약속이 있어서 갈 수 없어요. 다음에 꼭 함께해요."},{"id":"sj6_8","part":6,"jp":"店で財布をなくしました。何と言いますか。","correct":"すみません。店の中で財布をなくしたようです。落とし物として届いていないか、確認していただけますか。","opts":["すみません。店の中で財布をなくしたようです。落とし物として届いていないか、確認していただけますか。","よかったら、こちらに座ってください。","すみません、注文した料理と違います。確認していただけますか。","すみません、買った商品が壊れていました。交換できますか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"가게에서 지갑을 잃어버려 직원에게 분실물 확인을 요청하는 상황입니다.","answerMeaning":"실례합니다. 가게 안에서 지갑을 잃어버린 것 같습니다. 혹시 분실물로 접수된 것이 있을까요?"},{"id":"sj6_9","part":6,"jp":"電車で席を譲りたいです。何と言いますか。","correct":"よかったら、こちらの席に座ってください。私はもうすぐ降りますので、大丈夫です。","opts":["よかったら、こちらの席に座ってください。私はもうすぐ降りますので、大丈夫です。","すみません、写真を撮っていただけますか。","ごめんなさい。電車が遅れているので、十分ぐらい遅れます。","すみません、部屋が寒いので、暖房を確認していただけますか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"전철에서 다른 승객에게 자리를 양보하는 상황입니다.","answerMeaning":"괜찮으시면 이 자리에 앉으세요. 저는 곧 내리니까 괜찮습니다."},{"id":"sj6_10","part":6,"jp":"写真を撮ってほしいです。何と言いますか。","correct":"すみません。お忙しいところ申し訳ありませんが、ここで写真を一枚撮っていただけますか。","opts":["すみません。お忙しいところ申し訳ありませんが、ここで写真を一枚撮っていただけますか。","すみません、注文した料理と違います。確認していただけますか。","すみません、駅へはどう行けばいいですか。","申し訳ありませんが、会議の時間を変更してもよろしいでしょうか。"],"ko":"상황에 맞는 가장 자연스러운 답변","explanation":"상황을 설명한 다음 정중하게 요청하거나 양해를 구하는 답변입니다. 「〜ていただけますか」는 공손한 부탁, 「〜てもよろしいでしょうか」는 정중한 허락 요청입니다.","questionMeaning":"다른 사람에게 사진 촬영을 정중히 부탁하는 상황입니다.","answerMeaning":"실례합니다. 죄송하지만 여기서 사진 한 장 찍어 주실 수 있을까요?"},{"id":"sj7_1","part":7,"jp":"4つの場面を順番に見て、最も自然な説明を選んでください。","scene":["🏠","🌧️","☂️","😊"],"sceneLabel":"외출과 비","correct":"家を出たら雨が降り始めました。傘を持っていたので大丈夫でした。","opts":["家を出たら雨が降り始めました。傘を持っていたので大丈夫でした。","店で買い物をしましたが、カードが使えませんでした。現金で払いました。","カフェで本を読んでいたら、友達から電話が来ました。一緒に会うことにしました。  좋다고 생각합니다. 어릴 때부터 익숙해질 수 있기 때문입니다.","私は都会に住みたいです。交通が便利ですし、買い物や病院に行くのも簡単だからです。":"저는 도시에 살고 싶습니다. 교통이 편리하고 쇼핑하거나 병원에 가기도 쉽기 때문입니다.","いいと思います。通勤時間を減らせるからです。":"좋다고 생각합니다. 통근 시간을 줄일 수 있기 때문입니다.","はい、そう思います。健康にいいからです。":"네, 그렇게 생각합니다. 건강에 좋기 때문입니다.","いいと思います。車より環境にやさしいからです。":"좋다고 생각합니다. 자동차보다 친환경적이기 때문입니다.","私は家で働くことに賛成です。通勤時間を減らせますし、その時間を家族や趣味のために使えるからです。":"저는 재택근무에 찬성합니다. 출퇴근 시간을 줄이고 그 시간을 가족이나 취미에 쓸 수 있기 때문입니다.","インターネットのほうが便利だと思います。時間を節約できます。":"인터넷이 더 편리하다고 생각합니다. 시간을 절약할 수 있습니다.","家で休むほうが好きです。ゆっくりできるからです。":"집에서 쉬는 편을 좋아합니다. 편하게 쉴 수 있기 때문입니다.","私は映画のほうが好きです。短い時間で物語を楽しめますし、映像や音楽も一緒に楽しめるからです。":"저는 영화를 더 좋아합니다. 짧은 시간에 이야기를 즐기고 영상과 음악도 함께 즐길 수 있기 때문입니다.","はい、立てたほうがいいです。時間を有効に使えるからです。":"네, 계획을 세우는 편이 좋습니다. 시간을 효율적으로 쓸 수 있기 때문입니다.","私は毎日運動することに賛成です。健康を維持できますし、ストレスも減らせるからです。":"저는 매일 운동하는 것에 찬성합니다. 건강을 유지하고 스트레스도 줄일 수 있기 때문입니다.","友達と旅行するほうがいいと思います。一緒に楽しめるからです。":"친구와 여행하는 편이 좋다고 생각합니다. 함께 즐길 수 있기 때문입니다.","私はインターネットで買い物するほうが便利だと思います。家でいつでも注文できますし、時間を節約できるからです。":"저는 인터넷 쇼핑이 더 편리하다고 생각합니다. 집에서 언제든 주문하고 시간을 절약할 수 있기 때문입니다.","私は賛成です。子供のころから外国語に慣れることができますし、ほかの国の文化も学べるからです。":"저는 찬성합니다. 어릴 때부터 외국어에 익숙해지고 다른 나라 문화도 배울 수 있기 때문입니다.","私は公共交通機関を利用するのはいいと思います。車より環境にやさしいですし、渋滞を減らすことにも役立つからです。":"저는 대중교통 이용이 좋다고 생각합니다. 자동차보다 친환경적이고 교통 체증 감소에도 도움이 되기 때문입니다.","私は休日は家で休むほうが好きです。平日は忙しいので、ゆっくり休んで次の週の準備をしたいからです。":"저는 휴일에는 집에서 쉬는 편이 좋습니다. 평일에는 바빠서 충분히 쉬고 다음 주를 준비하고 싶기 때문입니다.","私は旅行の前に計画を立てたほうがいいと思います。時間を有効に使えますし、大切な場所を見逃さずに済むからです。":"저는 여행 전에 계획을 세우는 편이 좋다고 생각합니다. 시간을 효율적으로 쓰고 중요한 장소도 놓치지 않을 수 있기 때문입니다.","すみません。注文した料理と違うようです。注文の内容を確認していただけますか。":"죄송합니다. 주문한 음식과 다른 것 같습니다. 주문 내용을 확인해 주시겠어요?","ごめんなさい。電車が遅れているので、十分ぐらい遅れます。":"미안해요. 전철이 늦어져서 10분 정도 늦겠습니다.","すみません、買った商品が壊れていました。交換できますか。":"죄송한데 산 물건이 고장 나 있었습니다. 교환할 수 있나요?","誘ってくれてありがとう。でも、予定があるので行けません。":"초대해 줘서 고마워요. 하지만 일정이 있어서 못 갑니다.","ごめんなさい。電車が遅れているので、十分ぐらい遅れそうです。少し待っていてください。":"미안해요. 전철이 늦어져서 10분 정도 늦을 것 같습니다. 조금 기다려 주세요.","すみません、駅へはどう行けばいいですか。":"죄송한데 역에는 어떻게 가면 되나요?","すみません、部屋が寒いので、暖房を確認していただけますか。":"죄송한데 방이 추워서 난방을 확인해 주시겠어요?","すみません、財布をなくしました。届いていませんか。":"죄송한데 지갑을 잃어버렸습니다. 접수된 것이 있나요?","すみません。駅に行きたいのですが、この道で合っていますか。道を教えていただけますか。":"죄송한데 역에 가고 싶은데 이 길이 맞나요? 길을 알려 주시겠어요?","申し訳ありませんが、会議の時間を変更してもよろしいでしょうか。":"죄송하지만 회의 시간을 변경해도 될까요?","よかったら、こちらに座ってください。":"괜찮으시면 여기에 앉으세요.","すみません。昨日買った商品が壊れていました。レシートもあるのですが、交換していただけますか。":"죄송한데 어제 산 물건이 고장 나 있었습니다. 영수증도 있는데 교환해 주시겠어요?","すみません、写真を撮っていただけますか。":"죄송한데 사진을 찍어 주시겠어요?","すみません。部屋がとても寒くて、暖房がうまく動いていないようです。確認していただけますか。":"죄송한데 방이 너무 춥고 난방이 제대로 작동하지 않는 것 같습니다. 확인해 주시겠어요?","すみません、注文した料理と違います。確認していただけますか。":"죄송한데 주문한 음식과 다릅니다. 확인해 주시겠어요?","申し訳ありませんが、別の予定が入ってしまいました。できれば会議の時間を変更してもよろしいでしょうか。":"죄송하지만 다른 일정이 생겼습니다. 가능하면 회의 시간을 변경해도 될까요?","誘ってくれてありがとう。でも、その日はもう予定があるので行けません。また今度ぜひ一緒に行きましょう。":"초대해 줘서 고마워요. 하지만 그날은 이미 일정이 있어서 못 갑니다. 다음에 꼭 함께 가요.","すみません。店の中で財布をなくしたようです。落とし物として届いていないか、確認していただけますか。":"죄송한데 가게 안에서 지갑을 잃어버린 것 같습니다. 분실물로 접수되었는지 확인해 주시겠어요?","よかったら、こちらの席に座ってください。私はもうすぐ降りますので、大丈夫です。":"괜찮으시면 이 자리에 앉으세요. 저는 곧 내리니까 괜찮습니다.","すみません。お忙しいところ申し訳ありませんが、ここで写真を一枚撮っていただけますか。":"바쁘신데 죄송하지만 여기서 사진 한 장 찍어 주시겠어요?","家を出たら雨が降り始めました。傘を持っていたので大丈夫でした。":"집을 나서자 비가 내리기 시작했습니다. 우산이 있어서 괜찮았습니다.","店で買い物をしましたが、カードが使えませんでした。現金で払いました。":"가게에서 쇼핑했지만 카드를 사용할 수 없어 현금으로 냈습니다.","カフェで本を読んでいたら、友達から電話が来ました。一緒に会うことにしました。":"카페에서 책을 읽다가 친구에게 전화가 왔습니다. 만나기로 했습니다.","犬と公園を散歩していたら雨が降りました。急いで家に帰りました。":"개와 공원을 산책하다가 비가 와서 급히 집에 돌아갔습니다.","駅に遅れそうだったので走りました。何とか電車に間に合いました。":"역에 늦을 것 같아서 뛰었습니다. 어떻게든 전철을 탈 시간에 맞췄습니다.","料理をしていたら少し焦がしてしまいました。でも、何とか食事を作りました。":"요리하다가 조금 태워 버렸지만 어떻게든 식사를 만들었습니다.","友達の誕生日にプレゼントを渡しました。とても喜んでくれたので、写真を撮りました。":"친구 생일에 선물을 건넸습니다. 매우 기뻐해 줘서 사진을 찍었습니다.","旅行の準備をして飛行機に乗りました。ホテルに着いてから観光しました。":"여행 준비를 하고 비행기를 탔습니다. 호텔에 도착한 후 관광했습니다.","パソコンが動かなくなりました。修理をお願いしたら、また使えるようになりました。":"컴퓨터가 작동하지 않게 되었습니다. 수리를 부탁하니 다시 쓸 수 있게 되었습니다.","天気がよかったので自転車で公園に行きました。きれいな花を見て写真を撮りました。":"날씨가 좋아 자전거로 공원에 갔습니다. 예쁜 꽃을 보고 사진을 찍었습니다.","はい、あります。私の場合は、普段の生活に合わせて決めています。":"예시 답변입니다. 개인 경험과 의견에 맞게 바꿔 말하세요.","질문을 듣고 스스로 답변한 뒤 예시를 확인합니다.":"질문을 듣고 스스로 답변한 뒤 예시를 확인합니다.","찬성·반대 중 한쪽을 골라 이유를 설명합니다.":"찬성·반대 중 한쪽을 골라 이유를 설명합니다.","실제 경험이나 구체적인 사례를 넣어 답합니다.":"실제 경험이나 구체적인 사례를 넣어 답합니다.","はい、あります。最近は忙しいですが、時間がある時に楽しんでいます。":"예시 답변입니다. 개인 경험과 의견에 맞게 바꿔 말하세요.","私はこの問題について、状況に応じて考えることが大切だと思います。メリットもありますが、デメリットもあるので、十分に話し合う必要があります。":"예시 답변입니다. 개인 경험과 의견에 맞게 바꿔 말하세요.","私は一人で買い物をするほうが好きです。自分のペースでゆっくり商品を選べるからです。":"저는 혼자 쇼핑하는 편을 좋아합니다. 제 속도로 천천히 상품을 고를 수 있기 때문입니다.","질문을 듣고 자신의 답변을 말한 뒤 예시를 확인합니다.":"질문을 듣고 자신의 답변을 말한 뒤 예시를 확인합니다.","자신의 경험과 이유를 들어 설명합니다.":"자신의 경험과 이유를 들어 설명합니다.","반대 의견과 비교해 설명합니다.":"반대 의견과 비교해 설명합니다.","私は金曜日の夜に一番疲れを感じます。一週間ずっと働いているので、家でゆっくり休みたいです。":"저는 금요일 밤에 가장 피곤합니다. 일주일 내내 일해서 집에서 푹 쉬고 싶습니다.","はい、あります。毎年家族と一緒に食事をして、新しい年の計画を立てています。":"네, 있습니다. 매년 가족과 함께 식사하고 새해 계획을 세웁니다.","いいえ、あまり出しません。普段は家で洗濯しますが、コートなどはクリーニングに出します。":"아니요, 자주 맡기지는 않습니다. 평소에는 집에서 세탁하지만 코트 등은 세탁소에 맡깁니다.","いいえ、まだありません。でも、映画が好きなので、機会があれば一度行ってみたいです。":"아니요, 아직 없습니다. 하지만 영화를 좋아해서 기회가 있으면 한번 가 보고 싶습니다.","大学を卒業することは就職に有利だと思います。専門知識を学べますし、応募できる仕事の幅も広がるからです。ただし、実際の経験や能力も大切だと思います。":"대학 졸업은 취업에 유리하다고 생각합니다. 전문지식을 배우고 지원할 수 있는 직업의 폭도 넓어지기 때문입니다. 다만 실무 경험과 능력도 중요하다고 생각합니다.","私はいいことだと思います。身だしなみを整えると自信が持てますし、相手に清潔な印象を与えられます。ただし、外見だけで人を判断するべきではありません。":"저는 좋은 현상이라고 생각합니다. 외모를 단정히 하면 자신감을 얻고 상대방에게 깔끔한 인상을 줄 수 있습니다. 다만 외모만으로 사람을 판단해서는 안 됩니다.","外国語の看板にはメリットがあると思います。外国人観光客にとって便利ですし、店の雰囲気も伝えられます。しかし、地元の人にも分かるように日本語や韓国語を併記するといいと思います。":"외국어 간판에는 장점이 있다고 생각합니다. 외국인 관광객에게 편리하고 가게 분위기도 전달할 수 있습니다. 하지만 지역 주민도 이해할 수 있도록 자국어를 병기하면 좋겠습니다.","小遣い帳を付けると、お金の使い方を考える習慣が身に付くと思います。何にいくら使ったか分かるので、無駄遣いを減らして貯金することもできます。":"용돈기입장을 쓰면 돈을 어떻게 사용할지 생각하는 습관이 생긴다고 생각합니다. 어디에 얼마를 썼는지 알 수 있어 낭비를 줄이고 저축도 할 수 있습니다."};
for(const w of WORDS){if(w.jp&&w.kana&&/[一-龯々]/.test(w.jp)&&!SJPT_FURIGANA_LEXICON[w.jp])SJPT_FURIGANA_LEXICON[w.jp]=w.kana;}
for(const w of WORDS){
 if(w.cat!=='verb'||!w.group||!w.jp||!w.kana)continue;
 const variants={nai:'ない',te:'て',ta:'た',masu:'ます',potential:'可能',tara:'たら'};
 const stem=w.jp.match(/^(.*[一-龯々])([ぁ-ん]+)$/);
 if(!stem)continue;
 const kanaSuffix=stem[2];
 if(!w.kana.endsWith(kanaSuffix))continue;
 const kanjiRead=w.kana.slice(0,-kanaSuffix.length);
 if(kanjiRead&&!SJPT_FURIGANA_LEXICON[stem[1]])SJPT_FURIGANA_LEXICON[stem[1]]=kanjiRead;
}

const SJPT_FURIGANA_KEYS=Object.keys(SJPT_FURIGANA_LEXICON).sort((a,b)=>b.length-a.length);
function sjptFurigana(t){
 const raw=String(t);let i=0,result='';
 while(i<raw.length){
  let match=null;
  for(const k of SJPT_FURIGANA_KEYS){if(raw.startsWith(k,i)){match=k;break;}}
  if(match){result+=`<ruby>${esc(match)}<rt>${esc(SJPT_FURIGANA_LEXICON[match])}</rt></ruby>`;i+=match.length;}
  else{result+=esc(raw[i]);i++;}
 }
 return result;
}

STORY_DISTRACTORS.forEach((rows,i)=>{const x=SJPT_QUESTIONS.find(x=>x.id==='sj7_'+(i+1));x.opts=[x.correct,...rows.map(r=>r[0])];x.answerMeaning=SJPT_OPTION_KO[x.correct];x.optionReasons={[x.correct]:x.answerMeaning+' 네 장면의 사건 순서와 일치합니다.'};for(const [jp,ko,reason] of rows){SJPT_OPTION_KO[jp]=ko;x.optionReasons[jp]=ko+' '+reason}});
const LISTEN_TRANSLATION_FIXES={'친구에게 사진을 찍어 달라고 했습니다.':'친구가 사진을 찍어 주었습니다.','친구에게 사진을 보여 달라고 했습니다.':'친구가 사진을 보여 주었습니다.'};
for(const x of LISTEN_QUESTIONS){for(const key of ['correct','ko','explanation'])if(typeof x[key]==='string'){for(const [a,b] of Object.entries(LISTEN_TRANSLATION_FIXES))x[key]=x[key].replaceAll(a,b);x[key]=x[key].replaceAll('형은','형/오빠는').replaceAll('형도','형/오빠도')}x.opts=x.opts.map(o=>(LISTEN_TRANSLATION_FIXES[o]||o).replaceAll('형은','형/오빠는').replaceAll('형도','형/오빠도'));}

function feedbackText(text,gloss=''){
 let value=String(text||'').trim();
 // Remove translation prefixes and stock instructions, never truncate a real explanation.
 if(gloss&&value.startsWith(gloss))value=value.slice(gloss.length).trim();
 value=value.replace(/그림에 나타난 대상·행동·순서와 보기를 비교하세요\.?/g,'')
  .replace(/네 장면의 사건 순서와 일치합니다\.?/g,'')
  .replace(/전체 문장을 듣고 시간·시제·부정·동작·순서 등을 구분하세요\.?/g,'').trim()
  .replace(/^정답\s*[:·]\s*/, '').trim();
 return value===gloss?'':value;
}
function sjChoiceTranslation(x,o){return x.optionTranslations?.[o]||(o===x.correct&&x.answerMeaning?x.answerMeaning:SJPT_OPTION_KO[o]||'');}
function sjSpecificReason(x,o){return feedbackText(x.optionReasons?.[o],sjChoiceTranslation(x,o));}
function feedbackDetails(rows){return rows.length?`<details class="feedback-details"><summary>다른 보기 해설</summary>${rows.map(([number,reason])=>`<p><strong>${number}번</strong> ${esc(reason)}</p>`).join('')}</details>`:'';}
function sjResult(x,choices,listen){
 const ok=sjSelected===x.correct,number=choices.indexOf(x.correct)+1;
 const core=feedbackText(x.learningPoint||(x.responsePractice?x.optionReasons?.[x.correct]:x.explanation),listen?x.correct:sjChoiceTranslation(x,x.correct));
 const selectedReason=!ok?sjSpecificReason(x,sjSelected):'';
 const seen=new Set([core,selectedReason,'']);
 const rows=choices.flatMap((o,i)=>{if(o===x.correct||o===sjSelected)return [];const reason=sjSpecificReason(x,o);if(seen.has(reason))return [];seen.add(reason);return [[i+1,reason]]});
 const question=listen?x.ko:x.questionMeaning;
 return `<div class="notice feedback-result ${ok?'':'bad'}"><strong>${ok?'정답입니다!':'오답입니다.'} · 정답 ${number}번</strong>${core?`<p class="feedback-core">${esc(core)}</p>`:''}${selectedReason&&selectedReason!==core?`<p class="feedback-selected"><strong>선택한 보기:</strong> ${esc(selectedReason)}</p>`:''}${feedbackDetails(rows)}${question?`<details class="feedback-question"><summary>${listen?'들은 문장':'질문 뜻'}</summary>${listen?`<p>${sjFuriganaVisible?sjptFurigana(x.jp):esc(x.jp)}</p>`:`<p>${esc(question)}</p>`}</details>`:''}</div>`;
}

function quizSpecificReason(o){
 const w=q.baseWord||q.w;
 if(q.optionReasons?.[o])return feedbackText(q.optionReasons[o],quizChoiceGloss(o));
 if(q.actual==='incorrect'){const form=String(o).split(' · ')[0],k=FORM_KINDS.find(k=>conjugate(w,k)===form);return k?`${form}은 ${QUIZ_FORM_LABELS[k]}이며 ‘${conjugationMeaning(w.ko,k)}’를 나타냅니다.`:'';}
 return '';
}
function quizResult(){
 const ok=normalize(selected)===normalize(q.correct),number=q.opts.indexOf(q.correct)+1,w=q.baseWord||q.w;
 let core=q.actual==='conj'?conjugationRule(w,q.kind):q.actual==='sentence'?feedbackText(q.sentenceExplanation):q.actual==='incorrect'?quizSpecificReason(q.correct):'';
 const selectedReason=!ok?quizSpecificReason(selected):'';
 const seen=new Set([core,selectedReason,'']);
 const rows=q.opts.flatMap((o,i)=>{if(o===q.correct||o===selected)return [];const reason=quizSpecificReason(o);if(seen.has(reason))return [];seen.add(reason);return [[i+1,reason]]});
 return `<div class="notice feedback-result ${ok?'':'bad'}"><strong>${ok?'정답입니다!':'오답입니다.'} · 정답 ${number}번</strong>${q.actual==='sentence'?`<p class="feedback-completed">${quizFuriganaVisible?sjptFurigana(w.jp.replace('（　）',q.correct)):esc(w.jp.replace('（　）',q.correct))}</p>`:''}${core?`<p class="feedback-core">${esc(core)}</p>`:''}${selectedReason&&selectedReason!==core?`<p class="feedback-selected"><strong>선택한 보기:</strong> ${esc(selectedReason)}</p>`:''}${feedbackDetails(rows)}</div>`;
}

let sjReviewId=null;
function gradeSjQuestion(){
 if(sjChecked||!sjSelected)return;
 const x=sjQuestion,ok=sjSelected===x.correct;sjChecked=true;sjCounts.n++;if(ok)sjCounts.correct++;
 if(reviewActive&&sjReviewId){const m=state.mistakes.find(m=>m.id===sjReviewId);if(m){m.attempts=(m.attempts||0)+1;m.lastReviewed=Date.now();if(ok){m.resolved=true;m.resolvedAt=Date.now()}else m.answer=sjSelected;}}
 else if(!ok){const snapshot=JSON.parse(JSON.stringify(x));snapshot.optionTranslations=Object.fromEntries(x.opts.map(o=>[o,sjChoiceTranslation(x,o)]));storeMistake({w:{id:x.id,jp:x.jp,kana:x.jp,ko:x.questionMeaning||x.ko,cat:sjMode},actual:sjMode,correct:x.correct,opts:[...x.opts],sjptQuestion:snapshot,sjptMode:sjMode},sjSelected);}
 save();sjptPage();
}
function advanceSjQuestion(){if(reviewActive&&sjReviewId)nextReview();else{sjReviewId=null;sjPick();sjptPage()}}
function nextReview(){
 revealed=false;selected='';
 while(reviewCursor<reviewQueue.length){const id=reviewQueue[reviewCursor++],m=state.mistakes.find(x=>x.id===id);if(!m||m.resolved)continue;const restored=restoreMistake(m);if(!restored)continue;
  if(restored.sjptQuestion){q=null;tab='sjpt';sjMode=restored.sjptMode;sjQuestion=restored.sjptQuestion;sjReviewId=m.id;sjSelected='';sjChecked=false;sjShowText=sjMode!=='listen';}
  else{tab='quiz';sjReviewId=null;q={...restored,mistakeId:m.id};}render();return;
 }
 reviewActive=false;sjReviewId=null;q=null;sjQuestion=null;tab='review';render();
}
function sjReviewCard(w,items){return `<article class="card review-card"><div class="row"><strong>${w.cat==='listen'?'듣기':'SJPT '+items[0].snapshot.sjptQuestion.part+'부'}</strong><span class="pill orange">${items.length}건</span></div><p class="sj-review-question">${sjptFurigana(w.jp)}</p><p>${esc(w.ko)}</p><button class="btn small ghost" data-tts="${esc(w.jp)}">▶ 질문 듣기</button><details class="review-details"><summary>내 답과 정답 확인</summary>${items.map(m=>`<div class="review-example"><p>${m.resolved?'복습 완료':'복습 필요'} · 시도 ${m.attempts||0}회</p><p>내 답: ${sjptFurigana(m.answer)}</p><p>정답: ${sjptFurigana(m.correct)}</p><p>${esc(sjChoiceTranslation(m.snapshot.sjptQuestion,m.correct))}</p></div>`).join('')}</details></article>`;}

let vocabView='library',antonymCategory='all',cardScope='all',cardDeck=[],cardIndex=0,cardAnswer=null,cardRight=0,cardWrongIds=[];
const originalVocabPage=vocab,originalVocabSection=section;
function vocabTabs(){return `<div class="vocab-view-tabs" role="group" aria-label="단어장 학습 방식">${[['library','전체 단어'],['antonyms','반의어'],['cards','두 카드 연습']].map(([key,label])=>`<button class="btn ${vocabView===key?'primary':''}" data-vocab-view="${key}" aria-pressed="${vocabView===key}">${label}</button>`).join('')}</div>`;}
section=function(content){originalVocabSection((tab==='vocab'?vocabTabs():'')+content);};
function wordReading(w){return `<ruby>${esc(w.jp)}<rt>${esc(w.kana)}</rt></ruby>`;}
function antonymFilters(){return `<label class="contrast-filter">주제 <select class="select" id="antonym-category"><option value="all">전체 주제</option>${[...new Set(ANTONYM_PAIRS.map(p=>p.category))].map(c=>`<option ${antonymCategory===c?'selected':''}>${c}</option>`).join('')}</select></label>`;}
function contrastSources(p){return `<details class="contrast-sources"><summary>앱의 SJPT 관련 문항 · ${p.relatedCount}개</summary>${p.sources.map(s=>`<div><span class="pill">${s.part}부 · ${s.kind} 발췌</span><p class="contrast-example-jp">${sjptFurigana(s.jp)}</p><p>${esc(s.ko)}</p><button class="btn ghost" data-tts="${esc(s.jp)}">▶ 문장 듣기</button></div>`).join('')}<p class="sub">위 문항에서 쓰인 어휘·주제와 연결한 반의어 학습입니다. 비교 예문은 연습용으로 구성했습니다.</p></details>`;}
vocab=function(){if(vocabView==='library'){originalVocabPage();return}if(vocabView==='cards'){vocabCardsPage();return}
 const pairs=ANTONYM_PAIRS.filter(p=>antonymCategory==='all'||p.category===antonymCategory);
 section(`<h2>SJPT 반의어로 함께 기억하기</h2><p class="sub">초중급 ${ANTONYM_PAIRS.length}쌍 · 의견·정책·상황 대응에 쓰는 표현입니다. 앱 안의 관련 SJPT 문항이 많은 순서로 보여 줍니다.</p>${antonymFilters()}<div class="antonym-grid">${pairs.map(p=>`<article class="card antonym-pair"><div class="row"><strong>${esc(p.context)}</strong><button class="btn small" data-pair-practice="${p.id}">이 쌍 연습</button></div><div class="contrast-words">${p.words.map((w,i)=>`<div><div class="contrast-jp">${wordReading(w)}</div><p>${esc(w.ko)}</p><button class="btn ghost" data-tts="${esc(w.kana)}" aria-label="${esc(w.jp)} 발음 듣기">▶ 듣기</button><button class="btn ghost" data-studied="${w.id}" aria-pressed="${isStudied(w)}">${isStudied(w)?'✓ 학습 완료':'학습 완료 표시'}</button></div>`).join('')}</div><details class="contrast-examples"><summary>비교 예문 · 뜻 차이</summary>${p.examples.map(e=>`<p class="contrast-example-jp">${sjptFurigana(e.jp)} <button class="btn ghost" data-tts="${esc(e.jp)}" aria-label="예문 듣기">▶</button></p><p>${esc(e.ko)}</p>`).join('')}${p.note?`<p class="contrast-note">${sjptFurigana(p.note)}</p>`:''}</details>${contrastSources(p)}</article>`).join('')}</div>`);
};
function startCardRound(ids){
 const pool=ANTONYM_PAIRS.filter(p=>ids?ids.includes(p.id):cardScope==='all'||p.words.some(isStudied));
 // Practice both meanings, with exactly balanced left/right correct positions.
 const targets=shuffle(shuffle(pool).slice(0,5).flatMap(p=>[0,1].map(target=>({p,target})))),positions=shuffle(targets.map((_,i)=>i%2));
 cardDeck=targets.map(({p,target},i)=>({pairId:p.id,target,order:positions[i]===0?[target,1-target]:[1-target,target]}));
 cardIndex=0;cardAnswer=null;cardRight=0;cardWrongIds=[];
}
function currentCard(){return cardDeck[cardIndex];}
function gradeVocabCard(answer){
 const item=currentCard();if(!item||cardAnswer!==null||!item.order.includes(answer))return;
 const pair=ANTONYM_PAIRS.find(p=>p.id===item.pairId),word=pair.words[item.target],ok=answer===item.target;
 cardAnswer=answer;if(ok)cardRight++;else cardWrongIds.push(pair.id);
 const s=state.stats[word.id]||{right:0,wrong:0,streak:0};if(ok){s.right++;s.streak++}else{s.wrong++;s.streak=0}s.last=Date.now();state.stats[word.id]=s;
 state.history.push({time:Date.now(),id:word.id,ok,kind:'vocab-cards'});if(state.history.length>3000)state.history=state.history.slice(-3000);
 if(!ok){storeMistake({w:{...word,ko:word.ko+' · '+pair.context},actual:'ko2jp',correct:word.jp,opts:item.order.map(i=>pair.words[i].jp),optionReasons:Object.fromEntries(pair.words.map(w=>[w.jp,`${pair.context}에서 ‘${w.ko}’라는 뜻입니다.`]))},pair.words[answer].jp);}
 save();render();
}
function vocabCardsPage(){
 const intro=`<h2>한국어 뜻에 맞는 카드는?</h2><p class="sub">SJPT 초중급 반의어 ${ANTONYM_PAIRS.length}쌍 · 한 번에 최대 10문제입니다. 오답은 오답노트에 저장합니다.</p><label class="contrast-filter">연습 범위 <select class="select" id="card-scope"><option value="all" ${cardScope==='all'?'selected':''}>전체 반의어</option><option value="studied" ${cardScope==='studied'?'selected':''}>학습 완료한 단어가 있는 쌍</option></select></label>`;
 if(!cardDeck.length){section(intro+'<div class="card"><p>이 범위에 연습할 반의어가 없습니다. 반의어 탭에서 단어에 학습 완료를 표시하거나 전체 반의어로 바꿔 주세요.</p></div>');return;}
 const item=currentCard();
 if(!item){section(intro+`<div class="card card-round-summary" role="status"><h3>이번 연습을 마쳤어요</h3><p>${cardDeck.length}문제 중 ${cardRight}개 정답</p><div class="actions"><button class="btn primary" data-card-restart="all">새 문제로 연습</button>${cardWrongIds.length?'<button class="btn" data-card-restart="wrong">틀린 쌍 다시 연습</button><button class="btn ghost" data-go="review">오답노트 열기</button>':''}</div></div>`);return;}
 const p=ANTONYM_PAIRS.find(p=>p.id===item.pairId),w=p.words[item.target],answered=cardAnswer!==null,ok=cardAnswer===item.target;
 section(intro+`<div class="card two-card-practice"><p class="sub">${cardIndex+1} / ${cardDeck.length} · 정답 ${cardRight}</p><span class="pill">${esc(p.context)}</span><h3 class="card-korean">${esc(w.ko)}</h3><div class="two-card-options">${item.order.map(i=>`<div><button class="word-pick ${answered?(i===item.target?'correct':i===cardAnswer?'wrong':''):''}" data-word-pick="${i}" ${answered?'disabled':''}><span>${wordReading(p.words[i])}</span>${answered?`<span class="card-word-meaning">${i===item.target?'✓ 정답 · ':i===cardAnswer?'내 선택 · ':''}${esc(p.words[i].ko)}</span>`:''}</button><button class="btn ghost" data-tts="${esc(p.words[i].kana)}" aria-label="${esc(p.words[i].jp)} 발음 듣기">▶ 듣기</button></div>`).join('')}</div>${answered?`<div class="notice card-answer-result ${ok?'':'bad'}" role="status"><strong>${ok?'정답입니다!':'오답입니다. 오답노트에 저장했어요.'}</strong><p class="contrast-example-jp">${sjptFurigana(p.examples[item.target].jp)} <button class="btn ghost" data-tts="${esc(p.examples[item.target].jp)}" aria-label="예문 듣기">▶</button></p><p>${esc(p.examples[item.target].ko)}</p>${p.note?`<p>${sjptFurigana(p.note)}</p>`:''}</div><div class="actions"><button class="btn primary" data-card-next="1">${cardIndex+1===cardDeck.length?'결과 보기':'다음 카드 →'}</button></div>`:'<p class="sub">읽기를 보거나 발음을 들은 뒤 카드를 골라 주세요.</p>'}</div>`);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.vocabView){vocabView=b.dataset.vocabView;if(vocabView==='cards'&&!cardDeck.length)startCardRound();render();}
 else if(b.dataset.pairPractice){vocabView='cards';startCardRound([b.dataset.pairPractice]);render();}
 else if(b.dataset.wordPick!==undefined)gradeVocabCard(Number(b.dataset.wordPick));
 else if(b.dataset.cardNext&&cardAnswer!==null){cardIndex++;cardAnswer=null;render();if(typeof window.scrollTo==='function')window.scrollTo(0,0);}
 else if(b.dataset.cardRestart){startCardRound(b.dataset.cardRestart==='wrong'?[...new Set(cardWrongIds)]:undefined);render();}
});
document.addEventListener('change',e=>{if(e.target.id==='antonym-category'){antonymCategory=e.target.value;render();}else if(e.target.id==='card-scope'){cardScope=e.target.value;startCardRound();render();}});

// Enhance existing markup without replacing question state or localStorage.
const mobileBaseSection=section;
let mobileLastQuestion='';
section=function(content){mobileBaseSection(content);if(typeof window.matchMedia==='function')enhanceStudyLayout();};
function enhanceStudyLayout(){
 const app=document.getElementById('app'),mobile=window.matchMedia('(max-width:740px)').matches;
 const practicing=tab==='sjpt'||tab==='quiz';
 document.body.classList.toggle('mobile-practice',mobile&&practicing);
 let nav=document.getElementById('mobile-nav');
 if(!nav){nav=document.createElement('nav');nav.id='mobile-nav';nav.className='mobile-nav';nav.setAttribute('aria-label','주 메뉴');document.body.append(nav);}
 nav.innerHTML=[['home','홈'],['learn','학습'],['vocab','단어장'],['review','오답']].map(([key,label])=>`<button ${key==='learn'?'data-mobile-learn="1"':`data-go="${key}"`} ${tab===key||(key==='learn'&&['quiz','sjpt','counter'].includes(tab))?'aria-current="page"':''}>${label}</button>`).join('');
 for(const image of app.querySelectorAll('.sj-picture img')){
  const button=document.createElement('button');button.className='image-zoom-button';button.type='button';button.dataset.imageZoom='1';button.setAttribute('aria-label','문제 그림 확대');image.before(button);button.append(image);const hint=document.createElement('span');hint.className='image-zoom-hint';hint.textContent='그림을 누르면 확대할 수 있어요';button.append(hint);
 }
 if(!mobile)return;
 const top=document.createElement('div');top.className='mobile-top';
 const titles={home:'SJPT LAB',quiz:'단어·문장 연습',sjpt:sjMode==='listen'?'듣기 연습':`${sjQuestion?.part||''}부 연습`,vocab:'단어장',review:'오답 복습',counter:'조수사',settings:'설정·백업'};
 const count=tab==='sjpt'?`${sjCounts.n}문제 · 정답 ${sjCounts.correct}`:tab==='quiz'?`${session.n}문제 · 정답 ${session.correct}`:'';
 top.innerHTML=`<div><h1 tabindex="-1">${reviewActive&&practicing?'오답 복습 · ':''}${titles[tab]||'SJPT LAB'}</h1>${count?`<span class="mobile-progress">${count}</span>`:''}</div>`;
 const settings=document.createElement('details');settings.className='mobile-settings';settings.innerHTML='<summary>문제 설정</summary>';
 const tools=document.createElement('div');tools.className='mobile-learning-tools';
 if(practicing){
  const oldHead=app.firstElementChild;if(oldHead)oldHead.classList.add('mobile-replaced');
  if(tab==='sjpt'){
   for(const e of app.querySelectorAll(':scope > .sub'))e.classList.add('mobile-replaced');
   for(const e of app.querySelectorAll('.sj-modebar,.sj-parts'))settings.append(e);
   const listen=app.querySelector('[data-sj-tts]');if(listen){listen.textContent='▶ 질문 듣기';tools.append(listen);}
   const furi=app.querySelector('[data-sj-furigana]');if(furi){furi.textContent=sjFuriganaVisible?'후리가나 켜짐':'후리가나 켜기';furi.classList.toggle('reading-on',sjFuriganaVisible);furi.setAttribute('aria-pressed',String(sjFuriganaVisible));tools.append(furi);}
   const transcript=app.querySelector('[data-sj-transcript]');if(transcript)tools.append(transcript);
   for(const row of app.querySelectorAll('.sj-audio-row'))row.remove();
   app.querySelector('.sj-card').prepend(tools);
   const actions=app.querySelector('.sj-card > .actions');if(actions)actions.classList.add('mobile-actionbar');
  }else{
   const controls=app.querySelector('.quiz-controls');
   const furi=controls?.querySelector('[data-quiz-furigana]');if(furi){furi.textContent=quizFuriganaVisible?'후리가나 켜짐':'후리가나 켜기';furi.classList.toggle('reading-on',quizFuriganaVisible);tools.append(furi);}
   if(controls)settings.append(controls);
   const card=app.querySelector('.card');if(card){card.prepend(tools);const actions=card.querySelector(':scope > .actions');if(actions?.querySelector('#check,[data-next]'))actions.classList.add('mobile-actionbar');}
  }
  settings.insertAdjacentHTML('beforeend','<button class="btn ghost" data-mobile-learn="1">다른 학습 선택</button><button class="btn ghost" data-go="settings">설정·백업</button>');top.append(settings);
 }else top.insertAdjacentHTML('beforeend','<button class="btn ghost" data-go="settings" aria-label="설정 및 백업">설정</button>');
 app.prepend(top);
 const key=tab==='sjpt'?`sj:${sjQuestion?.id}`:tab==='quiz'?`quiz:${q?.w?.id}:${q?.actual}:${q?.kind}`:tab;
 if(key!==mobileLastQuestion){mobileLastQuestion=key;requestAnimationFrame(()=>{window.scrollTo(0,0);top.querySelector('h1')?.focus({preventScroll:true});});}
}
function openStudyDialog(kind,image){
 const old=document.querySelector('.app-dialog');if(old)old.close();
 const savedY=window.scrollY,focus=document.activeElement,overflow=document.body.style.overflow;
 const dialog=document.createElement('dialog');dialog.className='app-dialog'+(kind==='image'?' image-dialog':'');
 dialog.setAttribute('aria-label',kind==='image'?'문제 그림 확대':'학습 선택');
 dialog.innerHTML=`<div class="dialog-heading"><h2>${kind==='image'?'그림 확대':'어떤 연습을 할까요?'}</h2><button class="btn ghost" data-dialog-close="1" aria-label="닫기">닫기</button></div>`;
 if(kind==='image'){
  const viewport=document.createElement('div');viewport.className='image-viewport';const enlarged=image.cloneNode();enlarged.removeAttribute('loading');viewport.append(enlarged);dialog.append(viewport);
  dialog.insertAdjacentHTML('beforeend','<button class="btn" data-image-size="1" aria-pressed="false">더 크게 보기</button><p>확대한 그림은 좌우·위아래로 움직여 볼 수 있어요.</p>');
 }else dialog.insertAdjacentHTML('beforeend','<div class="learning-links"><button class="btn primary" data-go="sjpt">SJPT 문제 연습</button><button class="btn" data-go="quiz">단어·문장 연습</button><button class="btn" data-go="counter">조수사 익히기</button></div>');
 document.body.append(dialog);document.body.style.overflow='hidden';dialog.showModal();
 dialog.addEventListener('close',()=>{document.body.style.overflow=overflow;dialog.remove();if(kind==='image'){window.scrollTo(0,savedY);if(focus?.isConnected)focus.focus({preventScroll:true});}});
 dialog.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.dialogClose||b?.dataset.go)dialog.close();if(b?.dataset.imageSize){const zoomed=dialog.querySelector('.image-viewport').classList.toggle('zoomed');b.textContent=zoomed?'전체 그림 보기':'더 크게 보기';b.setAttribute('aria-pressed',String(zoomed));}});
}
if(typeof window.matchMedia==='function'){
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mobileLearn)openStudyDialog('learn');if(b.dataset.imageZoom)openStudyDialog('image',b.querySelector('img'));if(b.dataset.next||b.dataset.sjNext||b.dataset.new){requestAnimationFrame(()=>window.scrollTo(0,0));}if((b.dataset.sjCheck||b.id==='check')&&window.matchMedia('(max-width:740px)').matches){requestAnimationFrame(()=>document.querySelector('.feedback-result')?.scrollIntoView({block:'start'}));}});
 window.matchMedia('(max-width:740px)').addEventListener('change',()=>render());
}

render();
</script></body></html>
