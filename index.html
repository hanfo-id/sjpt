function home(){const attempted=Object.keys(state.stats).length,total=state.history.length,good=state.history.filter(h=>h.ok).length,wrong=Object.values(state.stats).filter(s=>s.wrong>0&&s.streak<2).length;section(`<div class="hero"><div class="eyebrow">YOUR JAPANESE, EVERY DAY</div><h1>일본어를 아는 것에서<br>말할 수 있는 것으로.</h1><p>중급 어휘와 기초 복습, 조수사 발음, 동사 활용을 하나의 학습 루틴으로 연결합니다.</p><div class="actions"><button class="btn primary" data-go="quiz">학습 시작 →</button><button class="btn" data-go="speaking">말하기 연습</button></div></div><div class="grid"><div class="card"><div class="statlabel">수록 학습 항목</div><div class="stat">${WORDS.length}</div><div class="sub">단어·표현·조수사 매핑</div></div><div class="card"><div class="statlabel">학습해 본 항목</div><div class="stat">${attempted}</div><div class="sub">${Math.round(attempted/WORDS.length*100)}% 학습 시작</div></div><div class="card"><div class="statlabel">누적 정답률</div><div class="stat">${total?Math.round(good/total*100):0}%</div><div class="sub">${total}문제 중 ${good}문제 정답</div></div></div><div class="section-title">오늘의 학습 로드맵</div><div class="split"><div class="card"><div class="row"><strong>적응형 문제 추천</strong><span class="pill orange">취약 ${wrong}개</span></div><p class="sub">이미 아는 25개 어휘는 낮은 빈도로 등장합니다. 오답을 내면 출제 비중이 올라갑니다.</p><div class="progress"><div style="width:${Math.min(100,session.n/state.settings.sessionSize*100)}%"></div></div><p class="sub">현재 세션 ${session.n} / ${state.settings.sessionSize}문제</p><button class="btn primary" data-go="quiz">오늘의 문제 풀기</button></div><div class="card"><strong>추천 학습 순서</strong><p class="sub">① 혼합 퀴즈 20문제<br>② 조수사 발음 5문제<br>③ 말하기 질문 1개</p><button class="btn" data-go="counter">조수사 연습하기</button></div></div>`)}
function quiz(){if(!q)next();const w=q.w,labels={nai:'ない형',te:'て형',ta:'た형',masu:'ます형',potential:'가능형',tara:'たら 조건형'},isChoice=q.opts.length>0;let prompt=q.actual==='meaning'?'일본어 단어의 한국어 뜻을 선택하세요.':q.actual==='counter'?'다음 수량을 일본어로 어떻게 읽을까요?':q.actual==='conj'?`다음 동사를 ${labels[q.kind]}으로 바꿔 입력하세요.`:q.actual==='reverse'?'한국어 뜻에 맞는 일본어 읽기를 입력하세요.':'이 단어를 사용해 일본어 문장 하나를 만들어 보세요.';let target=q.actual==='counter'?esc(w.ko):q.actual==='reverse'?esc(w.ko):ruby(w);let response=isChoice?`<div class="answers">${q.opts.map((o,i)=>`<button class="choice ${selected===o?'selected':''} ${revealed&&o===q.correct?'correct':''} ${revealed&&selected===o&&o!==q.correct?'wrong':''}" data-choice="${esc(o)}" ${revealed?'disabled':''}>${i+1}. ${esc(o)}</button>`).join('')}</div>`:`<input id="answer" class="textinput" placeholder="${q.actual==='sentence'?'일본어 문장을 입력하세요':'히라가나로 입력하세요'}" value="${esc(selected)}" ${revealed?'disabled':''} autocomplete="off" spellcheck="false">`;let result=revealed?`<div class="notice ${q.actual!=='sentence'&&normalize(selected)!==normalize(q.correct)&&!(q.actual==='reverse'&&normalize(selected)===normalize(w.jp))?'bad':''}">${q.actual==='sentence'?'<strong>자가 점검</strong> · 자동 채점 대신 예문을 참고해 문장에 단어를 정확히 사용했는지 확인하세요.':`<strong>${normalize(selected)===normalize(q.correct)||(q.actual==='reverse'&&normalize(selected)===normalize(w.jp))?'정답입니다!':'다시 복습해 보세요.'}</strong><br>정답: ${esc(q.correct)}`}<div class="sub">${esc(w.jp)} (${esc(w.kana)}) · ${esc(w.ko)}</div>${q.actual==='sentence'?`<div class="actions"><button class="btn small" data-self="yes">잘 사용했어요</button><button class="btn small" data-self="no">아직 어려워요</button></div>`:''}</div>`:'';section(`<div class="row"><div><div class="eyebrow">ADAPTIVE QUIZ</div><h2 style="margin:3px 0">오늘의 학습</h2></div><span class="pill">세션 ${session.n}문제 · 정답 ${session.correct}</span></div><div class="actions" style="margin:12px 0 20px"><select id="mode" class="select" style="max-width:260px"><option value="mixed" ${mode==='mixed'?'selected':''}>혼합 출제</option><option value="meaning" ${mode==='meaning'?'selected':''}>단어 뜻</option><option value="reverse" ${mode==='reverse'?'selected':''}>한국어 → 일본어</option><option value="conj" ${mode==='conj'?'selected':''}>동사 활용형</option><option value="counter" ${mode==='counter'?'selected':''}>조수사 발음</option><option value="sentence" ${mode==='sentence'?'selected':''}>문장 만들기</option></select><button class="btn small ghost" data-new="1">문제 바꾸기</button></div><div class="card" style="max-width:790px"><div class="row"><span class="pill">${{meaning:'어휘',reverse:'어휘 직접 입력',conj:'동사 활용',counter:'조수사',sentence:'문장 생성'}[q.actual]}</span><span class="sub">${q.actual==='counter'?esc(w.counter):CATS[w.cat]}</span></div><p class="prompt">${prompt}</p><div class="bigjp">${target}</div>${q.actual==='conj'?`<div class="sub">${esc(w.ko)} · ${w.group}그룹 동사</div>`:''}${q.actual!=='counter'&&q.actual!=='reverse'?`<button class="btn small ghost" data-tts="${esc(w.kana)}">▶ 발음 듣기</button>`:''}${response}${result}<div class="actions">${!revealed?`<button class="btn primary" id="check" ${!selected?'disabled':''}>${q.actual==='sentence'?'모범 학습 정보 보기':'정답 확인'}</button>`:`<button class="btn primary" data-next="1">다음 문제 →</button>`}</div></div><p class="sub">※ 문장 생성은 현재 자가 평가 방식입니다. 단순 단어 채점과 달리 여러 자연스러운 표현이 가능하기 때문입니다.</p>`)}
function vocab(){let data=WORDS.filter(w=>(filterCat==='all'||w.cat===filterCat)&&(`${w.jp} ${w.kana} ${w.ko}`).toLowerCase().includes(filterText.toLowerCase()));section(`<div class="row"><div><div class="eyebrow">WORD LIBRARY</div><h2 style="margin:3px 0">나만의 단어장</h2></div><span class="pill">${data.length}개 표시</span></div><p class="sub">'익숙함'을 표시해도 학습에서 제외되지 않으며 출제 빈도만 낮아집니다.</p><div class="actions"><select id="catfilter" class="select" style="max-width:190px"><option value="all">전체 품사</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${filterCat===k?'selected':''}>${v}</option>`).join('')}</select><input id="search" class="textinput" style="max-width:300px" placeholder="단어·읽기·뜻 검색" value="${esc(filterText)}"></div><div class="tablewrap" style="margin-top:15px"><table class="vocab"><thead><tr><th>일본어 / 읽기</th><th>뜻</th><th>숙련도</th><th>표시</th></tr></thead><tbody>${data.map(w=>{const s=state.stats[w.id]||{},k=state.known[w.id]??w.known;return `<tr><td><strong>${esc(w.jp)}</strong><small>${esc(w.kana)}</small></td><td>${esc(w.ko)}</td><td><span class="pill ${s.streak>=3?'green':s.wrong&&s.streak<2?'orange':''}">${s.streak>=3?'숙달':s.wrong&&s.streak<2?'복습 필요':k?'익숙함':'학습 중'}</span></td><td><button class="btn small" data-known="${w.id}">${k?'익숙함 ✓':'익숙함 표시'}</button></td></tr>`}).join('')}</tbody></table></div>`)}
function counter(){const groups=['all',...new Set(WORDS.filter(w=>w.cat==='counter').map(w=>w.counter))];let data=WORDS.filter(w=>w.cat==='counter'&&(counterGroup==='all'||w.counter===counterGroup));section(`<div class="eyebrow">PRONUNCIATION DRILLS</div><h2 style="margin:3px 0">조수사 발음 집중 훈련</h2><p class="sub">한국어 수량과 일본어 읽기를 직접 연결합니다. 같은 '1개'라도 일반 개수와 個(こ)는 읽기가 다릅니다.</p><div class="actions"><select id="counterfilter" class="select" style="max-width:220px">${groups.map(g=>`<option value="${g}" ${g===counterGroup?'selected':''}>${g==='all'?'전체 조수사':g}</option>`).join('')}</select><button class="btn primary" data-counterquiz="1">조수사 퀴즈 풀기</button></div><div class="grid" style="margin-top:15px">${data.map(w=>`<div class="card"><div class="row"><span class="pill">${esc(w.counter)}</span><button class="btn small ghost" data-tts="${esc(w.kana)}">▶ 듣기</button></div><div class="sub" style="margin-top:12px">${esc(w.ko)}</div><div class="counter-kana">${esc(w.kana)}</div></div>`).join('')}</div>`)}
function speaking(){const p=SPEAK[speechIndex];section(`<div class="eyebrow">SPEAKING PRACTICE</div><h2 style="margin:3px 0">SJPT 상황별 말하기</h2><p class="sub">질문을 듣고 직접 말해 보세요. 브라우저 마이크 녹음이나 AI 발음 채점 없이 TTS 듣기와 자가 점검을 제공합니다.</p><div class="card" style="max-width:850px"><div class="row"><span class="pill">상황 ${speechIndex+1} / ${SPEAK.length}</span><span class="sub">키워드: ${esc(p.keywords)}</span></div><h3>${esc(p.q)}</h3><div class="bigjp" style="font-size:24px">${esc(p.jp)}</div><div class="reading">${esc(p.kana)}</div><div class="actions"><button class="btn" data-tts="${esc(p.jp)}">▶ 질문 듣기</button><button class="btn" data-speechreveal="1">${speechReveal?'예시 답변 숨기기':'예시 답변 보기'}</button></div><p class="sub">답변을 먼저 소리 내어 말하고, 아래에 메모할 수 있습니다.</p><textarea id="speechinput" class="textinput" rows="4" placeholder="연습한 일본어 답변을 적어 보세요.">${esc(speechText)}</textarea>${speechReveal?`<div class="notice"><strong>예시 답변</strong><p>${esc(p.sample)}</p><div class="sub">${esc(p.reading)}</div><div class="actions"><button class="btn small" data-tts="${esc(p.sample)}">▶ 예시 듣기</button></div></div>`:''}<div class="actions"><button class="btn primary" data-speechnext="1">다음 상황 →</button></div></div>`)}
function settings(){section(`<div class="eyebrow">SETTINGS & BACKUP</div><h2 style="margin:3px 0">학습 환경 설정</h2><div class="split"><div class="card stack"><label class="row"><strong>후리가나 항상 표시</strong><input type="checkbox" id="furigana" ${state.settings.furigana?'checked':''}></label><div class="sub">문제와 단어장에서 한자 읽기를 표시합니다. 단어에 읽기가 제공된 경우 적용됩니다.</div><label>음성 속도 <strong id="rateText">${state.settings.ttsRate}×</strong><input style="width:100%" id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${state.settings.ttsRate}"></label><button class="btn" data-tts="こんにちは。今日は日本語を勉強しましょう。">▶ 일본어 음성 테스트</button><label>1회 학습 목표<select class="select" id="size">${[10,20,30,40].map(n=>`<option value="${n}" ${n===state.settings.sessionSize?'selected':''}>${n}문제</option>`).join('')}</select></label></div><div class="card stack"><strong>데이터 백업·복원</strong><p class="sub">학습 기록은 이 브라우저의 localStorage에 자동 저장됩니다. 다른 기기로 이동할 때 JSON 파일을 사용하세요.</p><button class="btn primary" data-export="1">↓ 학습 기록 JSON 백업</button><label class="btn" style="text-align:center">↑ JSON 백업 복원<input id="import" type="file" accept="application/json,.json" class="hidden"></label><button class="btn danger" data-reset="1">학습 기록 초기화</button></div></div>`)}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home,quiz,vocab,counter,speaking,settings}[tab])()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.go){tab=b.dataset.go;render()}else if(b.dataset.choice!==undefined&&!revealed){selected=b.dataset.choice;render()}else if(b.id==='check'){if(!selected&&q.actual!=='sentence')return;verify()}else if(b.dataset.next){next()}else if(b.dataset.new){next()}else if(b.dataset.known){const w=WORDS.find(x=>x.id===b.dataset.known);state.known[w.id]=!(state.known[w.id]??w.known);save();render()}else if(b.dataset.tts){speech(b.dataset.tts)}else if(b.dataset.counterquiz){mode='counter';tab='quiz';next()}else if(b.dataset.speechreveal){speechReveal=!speechReveal;render()}else if(b.dataset.speechnext){speechIndex=(speechIndex+1)%SPEAK.length;speechReveal=false;speechText='';render()}else if(b.dataset.self){record(b.dataset.self==='yes');next()}else if(b.dataset.export){const blob=new Blob([JSON.stringify({app:'sjpt-lab',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sjpt-lab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.dataset.reset){if(confirm('학습 기록과 익숙함 표시를 모두 초기화할까요?')){state={stats:{},history:[],known:{},settings:state.settings};save();q=null;session={n:0,correct:0};render()}}});
document.addEventListener('input',e=>{if(e.target.id==='answer'){selected=e.target.value;let b=document.getElementById('check');if(b)b.disabled=!selected.trim()}else if(e.target.id==='search'){filterText=e.target.value;let pos=e.target.selectionStart;vocab();let inp=document.getElementById('search');inp.focus();inp.setSelectionRange(pos,pos)}else if(e.target.id==='speechinput'){speechText=e.target.value}else if(e.target.id==='rate'){state.settings.ttsRate=+e.target.value;document.getElementById('rateText').textContent=e.target.value+'×';save()}});
document.addEventListener('change',async e=>{if(e.target.id==='mode'){mode=e.target.value;next()}else if(e.target.id==='catfilter'){filterCat=e.target.value;render()}else if(e.target.id==='counterfilter'){counterGroup=e.target.value;render()}else if(e.target.id==='furigana'){state.settings.furigana=e.target.checked;save();render()}else if(e.target.id==='size'){state.settings.sessionSize=+e.target.value;save()}else if(e.target.id==='import'){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='sjpt-lab'||!data.state||typeof data.state!=='object'||Array.isArray(data.state)||!data.state.stats||!Array.isArray(data.state.history)||!data.state.settings)throw Error('올바른 SJPT LAB 백업이 아닙니다.');if(!confirm('현재 학습 기록을 백업 파일로 교체할까요?'))return;state=data.state;state.known=state.known||{};state.settings=Object.assign({furigana:true,ttsRate:.86,sessionSize:20},state.settings);save();q=null;alert('복원했습니다.');render()}catch(err){alert('복원 실패: '+err.message)}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'&&!revealed){verify()}});render();
</script></body></html>
